# Mac-free cloud builds for the SyteNav Capacitor app (Codemagic).
# EAS Build is for Expo/React Native and does NOT apply to Capacitor — use this instead.
#
# Setup: connect this repo in Codemagic, add an App Store Connect API key
# integration named exactly `SyteNav ASC` (the name below is looked up by that
# string), then run a workflow. There is no environment variable group to
# create for iOS - the integration supplies the credentials, and the group this
# file used to reference held nothing and cost an afternoon.
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-capacitor-app/

workflows:
  ios-capacitor:
    name: SyteNav iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: SyteNav ASC   # create this API-key integration in Codemagic
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        # Holds ONE secure variable: CERTIFICATE_PRIVATE_KEY_B64, an RSA
        # private key, base64 encoded onto a single line.
        #
        # Creating a signing certificate requires a private key to create it
        # against, and a brand-new account has no distribution certificate at
        # all - so one must be made. Without this the signing step dies on its
        # first line with "Cannot save Signing Certificates without certificate
        # private key" - or, if the PEM is pasted with its line breaks lost,
        # "Provided value ... is not valid" - then keychain and use-profiles run against
        # nothing and the build fails three steps later complaining about a
        # provisioning profile. The real error is the first line.
        #
        # The key must be STABLE across builds. Generating a fresh one per build
        # would mint a new certificate every time, and Apple caps how many
        # distribution certificates an account may hold.
        #
        # I deleted this group earlier in the session on the grounds that it was
        # empty and nothing read it. It was empty because nobody had filled it
        # in yet, which is a different thing.
        - app_store_credentials
      # NO `ios_signing:` BLOCK, DELIBERATELY.
      #
      # That block turns on Codemagic's AUTOMATIC code signing, which runs as a
      # pre-build phase before any script in this file. It looks for an existing
      # distribution profile and fails if there is none - it does not create
      # one. On an account whose first build has never succeeded there is never
      # one, so it failed in under two seconds with
      #
      #     No matching profiles found for bundle identifier "com.sytenav.app"
      #     and distribution type "app_store"
      #
      # twice, the second time with the `--create` fix already in `scripts`
      # below - which never got to run. The instant failure is the tell: `npm
      # ci` alone takes minutes.
      #
      # The two mechanisms are mutually exclusive. Signing is scripted here
      # instead, because scripted signing is the only one that can CREATE what
      # is missing.
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Add iOS platform if missing
        script: |
          npx cap add ios || true
          npx cap sync ios
      # Fetch the signing files, CREATING them when they do not exist yet - a
      # new account has no distribution certificate and no provisioning profile,
      # and there is no Mac here to make either on. Credentials come from the
      # `SyteNav ASC` integration above, which Codemagic exposes to this CLI as
      # environment variables.
      #
      # `use-profiles` alone was what the first build tried: it APPLIES profiles
      # already on the machine, and never goes to get one.
      - name: Set up signing
        script: |
          # The key arrives BASE64 ENCODED, and is decoded to a file here.
          #
          # Passing the PEM directly in an environment variable failed with
          # "Provided value in environment variable CERTIFICATE_PRIVATE_KEY is
          # not valid" - the key itself was fine, but a PEM block is only valid
          # WITH its line breaks, and pasting a multi-line secret through a web
          # form loses them. Base64 is one unbroken line, so there is nothing
          # left for a form to mangle.
          # SAY WHAT IS WRONG. A missing variable decoded to an empty file, and
          # the CLI then reported `Provided value "" is not valid` - which reads
          # as a malformed key rather than an absent one, and cost a build to
          # tell apart. These two checks name the actual fault.
          if [ -z "${CERTIFICATE_PRIVATE_KEY_B64:-}" ]; then
            echo "CERTIFICATE_PRIVATE_KEY_B64 is empty or not set in this build."
            echo "In Codemagic: Applications > Work-OS-Navigator > Environment variables"
            echo "  * name must be exactly  CERTIFICATE_PRIVATE_KEY_B64"
            echo "  * group must be exactly app_store_credentials"
            echo "A variable in a group this workflow does not reference is invisible here."
            exit 1
          fi
          echo "Key variable found: ${#CERTIFICATE_PRIVATE_KEY_B64} characters of base64."

          # openssl rather than `base64 -d`: that flag is -d on GNU and -D on the
          # BSD base64 that ships with macOS, and this runs on a Mac.
          printf '%s' "$CERTIFICATE_PRIVATE_KEY_B64" | openssl base64 -d -A > /tmp/cert_key.pem

          if ! head -n1 /tmp/cert_key.pem | grep -q "BEGIN RSA PRIVATE KEY"; then
            echo "Decoded to $(wc -c < /tmp/cert_key.pem) bytes, which is not a PEM key."
            echo "The variable should hold BASE64 of the cert_key file - one long line,"
            echo "no BEGIN/END, no spaces. Re-copy it and try again."
            exit 1
          fi
          echo "Decoded a valid PEM private key."

          app-store-connect fetch-signing-files "com.sytenav.app" \
            --type IOS_APP_STORE \
            --create \
            --delete-stale-profiles \
            --certificate-key=@file:/tmp/cert_key.pem
          # --delete-stale-profiles removes a profile that no longer matches the
          # App ID's capabilities before making a new one. Without it, enabling
          # Push Notifications on the App ID did nothing for three builds in a
          # row: the profile minted BEFORE the capability was added kept being
          # reused, and a capability is never retrofitted onto an existing
          # profile. That was a manual "go and delete it in the portal" step,
          # and now it is not.

          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      # THE WORKSPACE, NOT THE PROJECT.
      #
      # ios/App/Podfile declares `pod 'Capacitor'` under `use_frameworks!`, and
      # CocoaPods wires its pods in through the WORKSPACE. Archiving the bare
      # .xcodeproj compiles an app that has never heard of them:
      #
      #     AppDelegate.swift:2:8: unable to resolve module dependency: 'Capacitor'
      #     import Capacitor
      #
      # The pods were installed - `[CP] Check Pods Manifest.lock` ran in the
      # failing log - the archive was simply not looking at them.
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-capacitor:
    name: SyteNav Android
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      node: 20
      groups:
        - google_play_credentials   # holds CM_KEYSTORE, CM_KEYSTORE_PASSWORD, etc.
      vars:
        PACKAGE_NAME: com.sytenav.app
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Add Android platform if missing
        script: |
          npx cap add android || true
          npx cap sync android
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > android/app/release.keystore
      - name: Build AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
