# Mac-free cloud builds for the SyteNav Capacitor app (Codemagic).
# EAS Build is for Expo/React Native and does NOT apply to Capacitor — use this instead.
#
# Setup: connect this repo in Codemagic, add an App Store Connect API key
# integration named exactly `SyteNav ASC` (the name below is looked up by that
# string), then run a workflow. There is no environment variable group to
# create for iOS - the integration supplies the credentials, and the group this
# file used to reference held nothing and cost an afternoon.
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-capacitor-app/

workflows:
  ios-capacitor:
    name: SyteNav iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: SyteNav ASC   # create this API-key integration in Codemagic
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        # Holds ONE secure variable: CERTIFICATE_PRIVATE_KEY_B64, an RSA
        # private key, base64 encoded onto a single line.
        #
        # Creating a signing certificate requires a private key to create it
        # against, and a brand-new account has no distribution certificate at
        # all - so one must be made. Without this the signing step dies on its
        # first line with "Cannot save Signing Certificates without certificate
        # private key" - or, if the PEM is pasted with its line breaks lost,
        # "Provided value ... is not valid" - then keychain and use-profiles run against
        # nothing and the build fails three steps later complaining about a
        # provisioning profile. The real error is the first line.
        #
        # The key must be STABLE across builds. Generating a fresh one per build
        # would mint a new certificate every time, and Apple caps how many
        # distribution certificates an account may hold.
        #
        # I deleted this group earlier in the session on the grounds that it was
        # empty and nothing read it. It was empty because nobody had filled it
        # in yet, which is a different thing.
        - app_store_credentials
      # NO `ios_signing:` BLOCK, DELIBERATELY.
      #
      # That block turns on Codemagic's AUTOMATIC code signing, which runs as a
      # pre-build phase before any script in this file. It looks for an existing
      # distribution profile and fails if there is none - it does not create
      # one. On an account whose first build has never succeeded there is never
      # one, so it failed in under two seconds with
      #
      #     No matching profiles found for bundle identifier "com.sytenav.app"
      #     and distribution type "app_store"
      #
      # twice, the second time with the `--create` fix already in `scripts`
      # below - which never got to run. The instant failure is the tell: `npm
      # ci` alone takes minutes.
      #
      # The two mechanisms are mutually exclusive. Signing is scripted here
      # instead, because scripted signing is the only one that can CREATE what
      # is missing.
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Add iOS platform if missing
        script: |
          npx cap add ios || true
          npx cap sync ios
      # Fetch the signing files, CREATING them when they do not exist yet - a
      # new account has no distribution certificate and no provisioning profile,
      # and there is no Mac here to make either on. Credentials come from the
      # `SyteNav ASC` integration above, which Codemagic exposes to this CLI as
      # environment variables.
      #
      # `use-profiles` alone was what the first build tried: it APPLIES profiles
      # already on the machine, and never goes to get one.
      - name: Set up signing
        script: |
          # The key arrives BASE64 ENCODED, and is decoded to a file here.
          #
          # Passing the PEM directly in an environment variable failed with
          # "Provided value in environment variable CERTIFICATE_PRIVATE_KEY is
          # not valid" - the key itself was fine, but a PEM block is only valid
          # WITH its line breaks, and pasting a multi-line secret through a web
          # form loses them. Base64 is one unbroken line, so there is nothing
          # left for a form to mangle.
          # SAY WHAT IS WRONG. A missing variable decoded to an empty file, and
          # the CLI then reported `Provided value "" is not valid` - which reads
          # as a malformed key rather than an absent one, and cost a build to
          # tell apart. These two checks name the actual fault.
          if [ -z "${CERTIFICATE_PRIVATE_KEY_B64:-}" ]; then
            echo "CERTIFICATE_PRIVATE_KEY_B64 is empty or not set in this build."
            echo "In Codemagic: Applications > Work-OS-Navigator > Environment variables"
            echo "  * name must be exactly  CERTIFICATE_PRIVATE_KEY_B64"
            echo "  * group must be exactly app_store_credentials"
            echo "A variable in a group this workflow does not reference is invisible here."
            exit 1
          fi
          echo "Key variable found: ${#CERTIFICATE_PRIVATE_KEY_B64} characters of base64."

          # openssl rather than `base64 -d`: that flag is -d on GNU and -D on the
          # BSD base64 that ships with macOS, and this runs on a Mac.
          printf '%s' "$CERTIFICATE_PRIVATE_KEY_B64" | openssl base64 -d -A > /tmp/cert_key.pem

          if ! head -n1 /tmp/cert_key.pem | grep -q "BEGIN RSA PRIVATE KEY"; then
            echo "Decoded to $(wc -c < /tmp/cert_key.pem) bytes, which is not a PEM key."
            echo "The variable should hold BASE64 of the cert_key file - one long line,"
            echo "no BEGIN/END, no spaces. Re-copy it and try again."
            exit 1
          fi
          echo "Decoded a valid PEM private key."

          app-store-connect fetch-signing-files "com.sytenav.app" \
            --type IOS_APP_STORE \
            --create \
            --delete-stale-profiles \
            --certificate-key=@file:/tmp/cert_key.pem
          # --delete-stale-profiles removes a profile that no longer matches the
          # App ID's capabilities before making a new one. Without it, enabling
          # Push Notifications on the App ID did nothing for three builds in a
          # row: the profile minted BEFORE the capability was added kept being
          # reused, and a capability is never retrofitted onto an existing
          # profile. That was a manual "go and delete it in the portal" step,
          # and now it is not.

          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      # A BUILD NUMBER APPLE HAS NOT SEEN BEFORE.
      #
      # THE BUG. Build 2 compiled, signed and produced an ipa, then the upload
      # was refused:
      #
      #     The bundle version must be higher than the previously uploaded
      #     version: '1'.
      #
      # `CURRENT_PROJECT_VERSION = 1` is hardcoded in the Xcode project and
      # nothing ever moved it, so every build after the first one collides with
      # build 1 - twenty minutes in, at the last step.
      #
      # $BUILD_NUMBER is Codemagic's own counter for this workflow. It counts
      # EVERY build including the failed ones, so it only ever goes up, and
      # there is no state to keep in the repo.
      #
      # NOT agvtool, which is the recipe everyone copies: it needs
      # VERSIONING_SYSTEM = "apple-generic" in the project and this one does not
      # have it, so it would fail with "Cannot find the Xcode project's
      # versioning system". Info.plist already reads CFBundleVersion from
      # $(CURRENT_PROJECT_VERSION), so setting that build setting IS setting the
      # bundle version.
      - name: Set the build number
        script: |
          if [ -z "${BUILD_NUMBER:-}" ] || [ "$BUILD_NUMBER" -lt 2 ]; then
            echo "BUILD_NUMBER is '${BUILD_NUMBER:-unset}', which Apple will reject:"
            echo "build 1 is already uploaded and the next one must be higher."
            exit 1
          fi
          PBX=ios/App/App.xcodeproj/project.pbxproj
          # BSD sed, because this runs on a Mac - the empty -i argument is required.
          sed -i '' -e "s/CURRENT_PROJECT_VERSION = [0-9.]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$PBX"
          # Say so HERE if it did not take, rather than at the upload twenty
          # minutes from now. A silent no-op looks exactly like success.
          COUNT=$(grep -c "CURRENT_PROJECT_VERSION = $BUILD_NUMBER;" "$PBX")
          if [ "$COUNT" -lt 2 ]; then
            echo "Only $COUNT of the 2 build-configuration entries took the new version."
            grep -n "CURRENT_PROJECT_VERSION" "$PBX"
            exit 1
          fi
          echo "Build number set to $BUILD_NUMBER in $COUNT configurations."

      # THE WORKSPACE, NOT THE PROJECT.
      #
      # ios/App/Podfile declares `pod 'Capacitor'` under `use_frameworks!`, and
      # CocoaPods wires its pods in through the WORKSPACE. Archiving the bare
      # .xcodeproj compiles an app that has never heard of them:
      #
      #     AppDelegate.swift:2:8: unable to resolve module dependency: 'Capacitor'
      #     import Capacitor
      #
      # The pods were installed - `[CP] Check Pods Manifest.lock` ran in the
      # failing log - the archive was simply not looking at them.
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # NO `submit_to_testflight`, deliberately.
        #
        # THE BUG. A build that compiled, signed, uploaded, and finished
        # processing on App Store Connect was reported as FAILED, because its
        # last step got a 422 from Apple:
        #
        #     Another build in the same train is already in beta review.
        #     Please submit it again once it gets completed.
        #
        # Beta App Review is a human queue that takes one build per version
        # train at a time, and build 1 was still sitting in it. Nothing was
        # wrong with build 2 - the binary was already delivered - and a red
        # build that actually succeeded is worse than no status at all.
        #
        # It was also doing nothing for us. Beta review gates EXTERNAL testers
        # only. Internal testers get a build the moment processing finishes,
        # which is how build 1 reached a phone while its own beta review was
        # still pending. So this flag submitted us to a queue we do not use, and
        # then failed the build over the queue being busy.
        #
        # Submitting for EXTERNAL testing is a deliberate, one-at-a-time,
        # human-reviewed act. It belongs in App Store Connect when we actually
        # want it, not on every push. See MOBILE.md.

  # TWO ANDROID WORKFLOWS, ONE RECIPE. Codemagic checks the Google Play upload
  # credentials BEFORE it builds anything, so a workflow with a `publishing:`
  # block cannot even produce an .aab until the Play service account exists -
  # and the first .aab has to exist first, because Play refuses an API upload
  # for an app that has never had one uploaded by hand. The first run died in
  # seconds on exactly that: "Provided Google Play service account credentials
  # could not be used". So `android-capacitor` builds and stops, and
  # `android-release` is the same recipe (the YAML anchor) plus the upload.
  android-capacitor: &android
    name: SyteNav Android
    # A MAC, NOT LINUX. The free Codemagic plan only includes the Mac
    # machines - `linux_x2` refused to start at all with "The selected instance
    # type is not available with the current billing plan". Android builds on
    # a Mac just as well. Which means every script below runs on BSD tools:
    # openssl for base64, never `base64 --decode` (GNU spelling).
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 20
      # Capacitor 6 builds with JDK 17. Left unset, the image's default Java
      # decides, and a Gradle/JDK mismatch fails twenty minutes in.
      java: 17
      groups:
        # google_play_credentials holds, all secure:
        #   CM_KEYSTORE                 the upload keystore, base64 on one line
        #   CM_KEYSTORE_PASSWORD        its password
        #   CM_KEY_ALIAS                the key's alias (sytenav, per MOBILE.md)
        #   CM_KEY_PASSWORD             the key's own password
        #   GOOGLE_SERVICES_JSON        Firebase's google-services.json, base64
        #   GCLOUD_SERVICE_ACCOUNT_CREDENTIALS  the Play upload service account
        - google_play_credentials
      vars:
        PACKAGE_NAME: com.sytenav.app
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Add Android platform if missing
        script: |
          npx cap add android || true
          npx cap sync android
      # SAY WHAT IS MISSING, BY NAME, BEFORE GRADLE RUNS. Same lesson as the iOS
      # signing step: an absent variable surfaces twenty minutes later as an
      # error about something else entirely.
      - name: Check the secrets are present
        script: |
          missing=""
          for v in CM_KEYSTORE CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD GOOGLE_SERVICES_JSON; do
            if [ -z "$(printenv "$v")" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "Not set in this build:$missing"
            echo "In Codemagic: Applications > Work-OS-Navigator > Environment variables,"
            echo "group google_play_credentials. A variable in another group is invisible here."
            exit 1
          fi
          if [ -z "${BUILD_NUMBER:-}" ]; then
            echo "BUILD_NUMBER is not set, so versionCode would be 1 and Play would refuse"
            echo "every upload after the first."
            exit 1
          fi
          echo "All secrets present. versionCode will be $BUILD_NUMBER."
      - name: Set up keystore
        script: |
          printf '%s' "$CM_KEYSTORE" | openssl base64 -d -A > android/app/release.keystore
          if ! keytool -list -keystore android/app/release.keystore -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" > /dev/null 2>&1; then
            echo "The keystore decoded, but it will not open with CM_KEYSTORE_PASSWORD,"
            echo "or has no key called '$CM_KEY_ALIAS'. Check both - the build would sign nothing."
            exit 1
          fi
          echo "Keystore opens and holds '$CM_KEY_ALIAS'."
      # WITHOUT THIS FILE THERE ARE NO ANDROID NOTIFICATIONS. build.gradle only
      # applies the google-services plugin when it exists, and without the
      # plugin the phone never gets an FCM token - register() waits forever.
      # It is not a secret in the password sense (it ships inside every APK),
      # but it names our Firebase project, so it is supplied here rather than
      # committed.
      - name: Add Firebase config
        script: |
          printf '%s' "$GOOGLE_SERVICES_JSON" | openssl base64 -d -A > android/app/google-services.json
          if ! grep -q '"package_name": *"com.sytenav.app"' android/app/google-services.json; then
            echo "google-services.json does not list com.sytenav.app. It is either not"
            echo "base64 of the file Firebase downloaded, or it is for a different app."
            exit 1
          fi
          echo "Firebase config in place."
      - name: Build AAB
        script: |
          cd android
          ./gradlew bundleRelease
      # AN APK TO TRY THE APP WITHOUT A PHONE. The .aab is what Play wants, but
      # every copy Play hands back out - the "universal APK" in the bundle
      # explorer included - carries Play's automatic integrity protection, which
      # refuses to start anywhere Play did not install it: an emulator in a
      # browser (Appetize) answered "Something went wrong. Check that Google
      # Play is enabled on your device". This one is built here, signed with the
      # same upload key, and never passes through Play, so it runs anywhere.
      # Same code, same config; not for distribution.
      - name: Build APK for testing
        script: |
          cd android
          ./gradlew assembleRelease
      # SIGNED, OR IT DOES NOT LEAVE. build.gradle only attaches the key when the
      # password is present, so a misnamed variable would produce an unsigned
      # bundle - which Play refuses at upload, after the whole build.
      - name: Check the bundle is signed
        script: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n1)
          if ! jarsigner -verify "$AAB" | grep -q "jar verified"; then
            echo "$AAB is not signed. Google Play will refuse it."
            exit 1
          fi
          echo "$AAB is signed."
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

  android-release:
    <<: *android
    name: SyteNav Android → Google Play
    # Everything above comes from the anchor, the variable group included - so
    # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS goes in google_play_credentials too: a
    # Google Cloud service-account JSON with release rights in Play Console ->
    # Users and permissions. MOBILE.md section 5.
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Play will not accept an API upload for an app that has never had a
        # build uploaded by hand. The first .aab goes up through the Play
        # Console (Testing > Internal testing); from then on this works.
        # See MOBILE.md section 5.
