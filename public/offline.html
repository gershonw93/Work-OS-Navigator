<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SyteNav - no connection</title>
<!--
  THE SCREEN YOU GET WHEN THE PHONE CANNOT REACH THE APP.

  The native shell loads app.sytenav.com. With no signal the webview shows its
  own blank white failure page, which reads as a broken app - and on a jobsite
  with one bar, that is not a rare event. Capacitor's `server.errorPath` points
  at this file instead (see capacitor.config.ts).

  It is deliberately standalone: no Tailwind, no fonts, no images, no network
  of any kind. A page shown BECAUSE the network is down cannot depend on it.
  The colours are the SyteNav "Field" tokens, written out literally for the
  same reason.
-->
<style>
  :root {
    --surface: #F4F4F1; --panel: #FFFFFF; --ink: #16181B; --muted-fg: #6A6E74;
    --line: #E7E7E2; --accent: #C9F24A; --accent-ink: #16181B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #0F1113; --panel: #16181B; --ink: #F2F2EF; --muted-fg: #9BA0A6;
      --line: #262A2E;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--surface); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 32px 28px; max-width: 380px; width: 100%; text-align: center;
  }
  .mark { width: 56px; height: 56px; margin: 0 auto 20px; display: block; }
  h1 { font-size: 20px; margin: 0 0 10px; letter-spacing: -0.01em; }
  p { margin: 0 0 24px; color: var(--muted-fg); font-size: 15px; }
  button {
    -webkit-appearance: none; appearance: none; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 600; border-radius: 10px;
    padding: 13px 24px; width: 100%; min-height: 48px;
  }
  button:active { opacity: .8; }
  .note { margin: 18px 0 0; font-size: 13px; }
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" rx="12" fill="#0F1113"/>
      <g transform="translate(24 24) scale(1.3) translate(-25.5 -25)">
        <path d="M14 13 L37 22 L26 26 L22 37 Z" fill="#C9F24A"/>
      </g>
    </svg>
    <h1>No connection</h1>
    <p>SyteNav can't reach the internet right now. Your work is safe - nothing has been lost.</p>
    <button type="button" onclick="location.replace('https://app.sytenav.com/')">Try again</button>
    <p class="note">If this keeps happening, check your signal or move somewhere with better reception.</p>
  </main>
</body>
</html>
