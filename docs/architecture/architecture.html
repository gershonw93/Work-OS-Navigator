<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SyteNav · Architecture Map</title>
<style>
/* ── SyteNav "Field" tokens ───────────────────────────────────────────── */
:root{
  --surface:#F4F4F1; --panel:#FFFFFF; --muted:#EDECE7; --muted2:#E3E1DB;
  --line:#E7E7E2; --line-soft:#EFEEE9;
  --ink:#16181B; --ink-soft:#3A3F46; --muted-fg:#6A6E74; --faint:#9A9C96;
  --accent:#C9F24A; --accent-fg:#5F7A12; --accent-ink:#16181B; --accent-tint:#ECF6C8;
  --success:#1F8F5F; --danger:#C2341C; --warn:#B57400; --info:#2563EB; --special:#7C3AED;
  --shadow:0 1px 2px rgba(22,24,27,.06), 0 8px 24px rgba(22,24,27,.06);
  --L-actors:#2563EB; --L-edge:#B57400; --L-shell:#7C3AED; --L-ui:#5F7A12;
  --L-api:#1F8F5F; --L-domain:#0E7490; --L-data:#4338CA; --L-external:#6A6E74;
  --edge-stroke:#C9C9C2; --edge-hl:#16181B;
}
@media (prefers-color-scheme: dark){ :root[data-theme="auto"]{ color-scheme:dark;
  --surface:#0F1113; --panel:#1F2227; --muted:#2A2E34; --muted2:#3A3F46;
  --line:#2A2E34; --line-soft:#23272D;
  --ink:#ECEEF0; --ink-soft:#C2C7CE; --muted-fg:#9AA0A8; --faint:#6E747C;
  --accent:#C9F24A; --accent-fg:#C9F24A; --accent-ink:#0F1113; --accent-tint:#2C3110;
  --success:#5FD89B; --danger:#FF7A5C; --warn:#FFB02E; --info:#7FB0FF; --special:#C4A2F5;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  --L-actors:#7FB0FF; --L-edge:#FFB02E; --L-shell:#C4A2F5; --L-ui:#C9F24A;
  --L-api:#5FD89B; --L-domain:#67E8F9; --L-data:#A5B4FC; --L-external:#9AA0A8;
  --edge-stroke:#4A5058; --edge-hl:#ECEEF0;
}}
:root[data-theme="dark"]{ color-scheme:dark;
  --surface:#0F1113; --panel:#1F2227; --muted:#2A2E34; --muted2:#3A3F46;
  --line:#2A2E34; --line-soft:#23272D;
  --ink:#ECEEF0; --ink-soft:#C2C7CE; --muted-fg:#9AA0A8; --faint:#6E747C;
  --accent:#C9F24A; --accent-fg:#C9F24A; --accent-ink:#0F1113; --accent-tint:#2C3110;
  --success:#5FD89B; --danger:#FF7A5C; --warn:#FFB02E; --info:#7FB0FF; --special:#C4A2F5;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  --L-actors:#7FB0FF; --L-edge:#FFB02E; --L-shell:#C4A2F5; --L-ui:#C9F24A;
  --L-api:#5FD89B; --L-domain:#67E8F9; --L-data:#A5B4FC; --L-external:#9AA0A8;
  --edge-stroke:#4A5058; --edge-hl:#ECEEF0;
}
:root[data-theme="light"]{ color-scheme:light; }

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--surface); color:var(--ink);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:99px;border:3px solid transparent;background-clip:content-box}

/* ── Layout ───────────────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100dvh}
header.bar{
  display:flex;align-items:center;gap:14px;padding:10px 16px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:none;z-index:30;
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand .sub{color:var(--muted-fg);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.tools{display:flex;align-items:center;gap:8px}
.search{position:relative}
.search input{
  width:210px;padding:7px 10px 7px 30px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:13px;outline:none;
}
.search input:focus{border-color:var(--accent-fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-fg) 18%,transparent)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;
  white-space:nowrap;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--muted);border-color:var(--muted2)}
.btn.icon{padding:7px 8px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

main{flex:1;display:flex;min-height:0;position:relative}
.stage{flex:1;position:relative;min-width:0;overflow:hidden;background:
  radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--muted-fg) 22%,transparent) 1px, transparent 0) 0 0/26px 26px;
}
svg#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#canvas.dragging{cursor:grabbing}

/* ── Nodes ────────────────────────────────────────────────────────────── */
.node{cursor:pointer}
.node .box{
  height:100%;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);padding:8px 10px 8px 12px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;
  font:inherit;color:var(--ink);transition:border-color .12s, transform .12s;
}
.node .box::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--lc)}
.node .t{font-weight:650;font-size:12.5px;line-height:1.25;letter-spacing:-.005em}
.node .k{font-size:10.5px;color:var(--muted-fg);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.node:hover .box{border-color:var(--lc);transform:translateY(-1px)}
.node.sel .box{border-color:var(--lc);box-shadow:0 0 0 2px color-mix(in srgb,var(--lc) 45%,transparent),var(--shadow)}
.node.dim{opacity:.16}
.node.hl .box{border-color:var(--lc);box-shadow:0 0 0 2px color-mix(in srgb,var(--lc) 55%,transparent),var(--shadow)}
.node.active .box{border-color:var(--lc);box-shadow:0 0 0 3px color-mix(in srgb,var(--lc) 70%,transparent),var(--shadow)}
.node.match .box{border-color:var(--accent-fg);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent-fg) 45%,transparent),var(--shadow)}
.dimmed .node:not(.hl):not(.match){opacity:.16}
.node.hidden,.edge.hidden,.layerlab.hidden{display:none}

/* ── Edges ────────────────────────────────────────────────────────────── */
.edge{fill:none;stroke:var(--edge-stroke);stroke-width:1.4;transition:stroke .12s,stroke-width .12s,opacity .12s}
.edge.kind-external{stroke-dasharray:5 4}
.edge.kind-event{stroke-dasharray:2 4}
.edge.kind-redirect{stroke-dasharray:8 4}
.dimmed .edge:not(.hl){opacity:.07}
.edge.hl{stroke:var(--edge-hl);stroke-width:2.4;opacity:1}
.edge.related{stroke:var(--accent-fg);stroke-width:2}
.arrow{fill:var(--edge-stroke)}
.arrow-hl{fill:var(--edge-hl)}

.elabel{font-size:9.5px;fill:var(--muted-fg);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none;opacity:0}
.edge-g.hl .elabel{opacity:1;fill:var(--ink)}

.badge circle{fill:var(--accent);stroke:var(--accent-ink);stroke-width:1}
.badge text{font-size:11px;font-weight:750;fill:var(--accent-ink);text-anchor:middle;dominant-baseline:central}

.layerlab{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;fill:var(--faint)}
.layerrule{stroke:var(--line);stroke-width:1}

/* ── Side panel ───────────────────────────────────────────────────────── */
aside{
  width:390px;flex:none;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;z-index:20;
}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);flex:none}
.tab{
  flex:1;padding:8px 6px;border:none;background:none;cursor:pointer;font-size:12.5px;font-weight:600;
  color:var(--muted-fg);border-bottom:2px solid transparent;border-radius:6px 6px 0 0;
}
.tab:hover{background:var(--muted);color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent-fg)}
.pane{flex:1;overflow-y:auto;padding:12px 14px 40px;display:none}
.pane.on{display:block}

.flowsearch{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:13px;outline:none;margin-bottom:10px}
.flowsearch:focus{border-color:var(--accent-fg)}
.cat{font-size:10.5px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
.cat:first-child{margin-top:2px}
.flow{
  width:100%;text-align:left;padding:9px 11px;border-radius:9px;border:1px solid transparent;
  background:var(--surface);cursor:pointer;margin-bottom:5px;transition:background .12s,border-color .12s;
}
.flow:hover{border-color:var(--muted2);background:var(--muted)}
.flow[aria-current="true"]{background:var(--accent-tint);border-color:var(--accent-fg)}
.flow .fn{font-weight:650;font-size:13px;display:flex;align-items:center;gap:7px}
.flow .fn .cnt{font-size:10.5px;font-weight:700;color:var(--muted-fg);background:var(--muted2);
  border-radius:99px;padding:1px 6px;flex:none}
.flow .fs{font-size:12px;color:var(--muted-fg);margin-top:3px;line-height:1.4}

.flowhead{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
.flowhead h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;flex:1}
.lede{color:var(--muted-fg);font-size:12.5px;margin:0 0 12px;line-height:1.5}
.stepnav{display:flex;gap:6px;margin-bottom:12px}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:2px;background:var(--line)}
.step{position:relative;padding:0 0 12px 34px;cursor:pointer}
.step .num{
  position:absolute;left:0;top:0;width:23px;height:23px;border-radius:99px;
  background:var(--muted);color:var(--muted-fg);border:2px solid var(--panel);
  display:grid;place-items:center;font-size:11.5px;font-weight:750;
}
.step[aria-current="true"] .num{background:var(--accent);color:var(--accent-ink)}
.step .st{font-weight:650;font-size:13px;line-height:1.35}
.step .sn{font-size:11px;color:var(--muted-fg);margin-top:1px}
.step .sd{font-size:12.5px;color:var(--muted-fg);margin-top:4px;line-height:1.5}
.step:hover .st{color:var(--accent-fg)}

.det h2{margin:0 0 2px;font-size:16px;font-weight:700;letter-spacing:-.015em}
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;background:var(--muted);color:var(--muted-fg);margin-right:5px}
.chip.lc{background:color-mix(in srgb,var(--lc) 16%,transparent);color:var(--lc)}
.sect{margin-top:16px}
.sect h3{margin:0 0 6px;font-size:10.5px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.sect p{margin:0;font-size:13px;line-height:1.55;color:var(--ink-soft)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.paths{list-style:none;margin:0;padding:0}
.paths li{padding:3px 0;border-bottom:1px solid var(--line-soft);color:var(--muted-fg);word-break:break-all}
.paths li:last-child{border-bottom:none}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--muted);color:var(--muted-fg)}
.linkrow{display:flex;flex-direction:column;gap:4px}
.linkbtn{text-align:left;background:none;border:none;padding:4px 6px;border-radius:6px;cursor:pointer;
  font-size:12.5px;color:var(--accent-fg);font-weight:600}
.linkbtn:hover{background:var(--muted)}
.empty{color:var(--faint);font-size:13px;text-align:center;padding:36px 12px;line-height:1.6}

.legend-item{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px}
.swatch{width:13px;height:13px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.12)}
.legend-line{width:26px;height:0;border-top-width:2px;flex:none}
.layertoggle{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px;cursor:pointer;user-select:none}
.layertoggle input{accent-color:var(--accent-fg);width:14px;height:14px;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px}
.kv dt{color:var(--muted-fg)}
.kv dd{margin:0;font-weight:600;text-align:right}
.note{font-size:12px;color:var(--muted-fg);line-height:1.55;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:9px 11px;margin-top:10px}

/* ── Tooltip ──────────────────────────────────────────────────────────── */
#tip{
  position:fixed;z-index:60;max-width:330px;padding:9px 11px;border-radius:9px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
  pointer-events:none;opacity:0;transition:opacity .1s;font-size:12.5px;line-height:1.5;
}
#tip.on{opacity:1}
#tip .tt{font-weight:700;margin-bottom:2px;font-size:13px}
#tip .tk{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg);margin-bottom:5px}
#tip .ts{color:var(--ink-soft)}
#tip .tp{margin-top:6px;color:var(--faint);border-top:1px solid var(--line-soft);padding-top:5px}

/* ── Zoom controls ────────────────────────────────────────────────────── */
.zoom{position:absolute;left:14px;bottom:14px;display:flex;gap:6px;z-index:15}
.zoom .btn{background:var(--panel);box-shadow:var(--shadow)}
.hint{position:absolute;right:14px;bottom:14px;z-index:15;font-size:11.5px;color:var(--faint);
  background:color-mix(in srgb,var(--panel) 82%,transparent);padding:4px 9px;border-radius:7px;
  border:1px solid var(--line);pointer-events:none}
#panelToggle{display:none}

/* ── Responsive ───────────────────────────────────────────────────────── */
@media (max-width:1000px){
  aside{
    position:absolute;inset:auto 0 0 0;width:100%;height:62dvh;border-left:none;
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow);
    transform:translateY(calc(100% - 0px));transition:transform .22s ease;
  }
  aside.open{transform:translateY(0)}
  #panelToggle{display:inline-flex;position:absolute;right:14px;bottom:14px;z-index:25;
    background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:var(--shadow)}
  .hint{display:none}
  .brand .sub{display:none}
  .search input{width:130px}
}
@media (max-width:640px){
  .brand h1{font-size:13.5px}
  .tools .btn span{display:none}
  .search input{width:110px}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>SyteNav · Architecture Map</h1>
      <span class="sub" id="subtitle"></span>
    </div>
    <div class="spacer"></div>
    <div class="tools">
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search components…" aria-label="Search components">
      </div>
      <button class="btn" id="fit" title="Fit to screen (F)"><span>Fit</span>⤢</button>
      <button class="btn icon" id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <main>
    <div class="stage" id="stage">
      <svg id="canvas" role="img" aria-label="Interactive architecture diagram">
        <g id="viewport">
          <g id="layersG"></g>
          <g id="edgesG"></g>
          <g id="nodesG"></g>
          <g id="badgesG"></g>
        </g>
      </svg>
      <div class="zoom">
        <button class="btn icon" id="zoomOut" aria-label="Zoom out">−</button>
        <button class="btn icon" id="zoomIn" aria-label="Zoom in">+</button>
      </div>
      <div class="hint">Drag to pan · scroll to zoom · click a node for detail</div>
      <button class="btn" id="panelToggle">Flows ▲</button>
    </div>

    <aside id="panel">
      <div class="tabs" role="tablist">
        <button class="tab" id="tab-flows" role="tab" aria-selected="true" aria-controls="pane-flows">Flows</button>
        <button class="tab" id="tab-detail" role="tab" aria-selected="false" aria-controls="pane-detail">Component</button>
        <button class="tab" id="tab-legend" role="tab" aria-selected="false" aria-controls="pane-legend">Legend</button>
      </div>
      <div class="pane on" id="pane-flows" role="tabpanel" aria-labelledby="tab-flows"></div>
      <div class="pane" id="pane-detail" role="tabpanel" aria-labelledby="tab-detail"></div>
      <div class="pane" id="pane-legend" role="tabpanel" aria-labelledby="tab-legend"></div>
    </aside>
  </main>
</div>

<div id="tip" role="tooltip"></div>

<script id="graph-data" type="application/json">{"$schema":"https://sytenav.com/schemas/architecture-graph-1.json","meta":{"name":"SyteNav (work-os-navigator)","description":"Construction management platform: quotes, bidding, budgets, schedule, field ops, compliance and money for general contractors and subcontractors. Next.js 14 App Router + Supabase (Postgres/Auth/Storage) on Vercel, with an Anthropic-powered document-reading layer.","version":"1.0.0","generated":"2026-08-04","commit":"e73b23f","repo":"gershonw93/work-os-navigator","purpose":"Machine-readable architecture graph for AI agents. Nodes are components, edges are the calls between them, flows are ordered end-to-end paths through those edges.","stats":{"api_routes":157,"pages":84,"layouts":7,"components":72,"sql_migrations":60,"db_tables":57,"ts_tsx_loc":55864},"stack":{"framework":"Next.js 14.2.16 (App Router, React 18, RSC + client components)","language":"TypeScript 5","styling":"Tailwind CSS 3 with CSS-variable design tokens (SyteNav \"Field\" theme, light + dark)","data":"Supabase Postgres, Supabase Auth (cookie sessions via @supabase/ssr), Supabase Storage","ai":"@anthropic-ai/sdk, model claude-opus-4-8, vision + PDF document blocks","hosting":"Vercel (SSR + serverless route handlers, one daily cron)","mobile":"Capacitor remote-URL native shell (loads the deployed web app); dedicated /field mobile shell in-app","notable_libs":["pdf-lib","pdfjs-dist","xlsx","leaflet","lucide-react","tailwind-merge","clsx"]},"layout":{"rule":"Nodes are placed in vertical columns by `layer`, ordered top-to-bottom by `order`. Renderers may compute x = layerIndex * columnWidth and y from `order`, centering each column.","layers":[{"id":"actors","index":0,"label":"Actors & Clients"},{"id":"edge","index":1,"label":"Edge"},{"id":"shell","index":2,"label":"App Shells"},{"id":"ui","index":3,"label":"UI Surfaces"},{"id":"api","index":4,"label":"API Layer"},{"id":"domain","index":5,"label":"Server Libraries"},{"id":"data","index":6,"label":"Data Plane"},{"id":"external","index":7,"label":"External Services"}]},"legend":{"node_kinds":{"actor":"A human or machine that originates traffic","edge":"Request interception before routing","shell":"A Next.js route group / layout that frames a set of pages","page":"A user-facing screen or cluster of screens","hook":"Client-side data/state module","api":"Route handlers under app/api","lib":"Shared server-side module","store":"Persisted data (Postgres, Auth, Storage)","external":"Third-party service reached over the network"},"edge_kinds":{"request":"Browser or client HTTP request","redirect":"Server-side redirect","render":"Server renders / mounts the target","fetch":"In-app fetch to an internal API route","query":"Database read/write","storage":"Object storage read/write","external":"Outbound call to a third-party API","event":"Side effect written for someone else to read (notification, activity log)"}},"conventions":{"auth":"Browser sessions are Supabase cookies, refreshed in middleware.ts. Route handlers authenticate with an `Authorization: Bearer \u003csupabase access token>` header, resolved by `db.auth.getUser(token)`.","db_access":"149 of 157 route handlers instantiate a Supabase client with SUPABASE_SERVICE_ROLE_KEY, which bypasses RLS. Row-level security is enabled on the base tables (18 ENABLE ROW LEVEL SECURITY statements in 001_initial_schema.sql) but the service-role path means authorization is enforced in route code, not by the database.","authorization":"The permission model lives in lib/permissions.ts (32 resources x view/create/edit/delete). The client resolves it via /api/me/permissions and hides UI; server-side re-checks exist in lib/server-permissions.ts (`getActor`/`actorCan`) but are currently wired into app/api/projects/route.ts plus the settings permission endpoints. Most other handlers authenticate the user and scope queries by company/project rather than consulting the permission grid.","no_account_access":"Subs, clients, architects and inspectors act through unguessable tokens in the URL (bid_invites.token, rfis.answer_token, compliance_requests.token, projects.client_portal_token, profiles.calendar_token). Those routes intentionally skip auth.","activity":"Cross-cutting writes go through lib/log-activity.ts (project_activity) and lib/notify.ts (notifications); the Recent Activity feed and the bell both read those tables.","notification_fanout":"To notify another company, select every profile at that company and insert one row per person. Never append .single() to a profiles-by-company query: PostgREST errors rather than returning a row whenever the count is not exactly one, so the guarded insert silently does nothing for any company with two or more users. That bug existed in the award and task-assignment routes and was fixed; invoices, bid invites, quote-request invites, award and task assignment now all fan out.","ai_review":"Every AI extraction returns a draft the user reviews and edits before anything is saved."}},"nodes":[{"id":"actor-office","label":"Office user","layer":"actors","order":0,"kind":"actor","summary":"Owner, admin, project manager or office staff working in the full desktop/responsive app.","detail":"Sees the (dashboard) shell: sidebar, top nav, project tabs. Role decides which tabs and actions exist.","tags":["human"]},{"id":"actor-field","label":"Field crew","layer":"actors","order":1,"kind":"actor","summary":"Worker or field member on a phone. Routed to the stripped-down Field Mode shell.","detail":"FIELD_ROLES = ['worker','member'] in lib/permissions.ts. Field supervisors stay in the full app because they need budget/compliance breadth.","tags":["human","mobile"]},{"id":"actor-sub","label":"Subcontractor","layer":"actors","order":2,"kind":"actor","summary":"Sub company with an account: receives bid invites, submits quotes, runs awarded jobs.","detail":"Company type drives sub-specific views (My Bids, My Jobs, quote-line-items-as-budget).","tags":["human"]},{"id":"actor-guest","label":"Client / architect (no account)","layer":"actors","order":3,"kind":"actor","summary":"Clients, architects, inspectors and un-registered subs who act purely through secure token links.","detail":"Client portal, RFI answer link, compliance upload link, bid submission link, sign-off link. No login, no Supabase user.","tags":["human","public"]},{"id":"actor-superadmin","label":"Platform super admin","layer":"actors","order":4,"kind":"actor","summary":"Emails listed in lib/super-admin.ts. Can open /admin and impersonate any account for support.","detail":"Gated twice: super-admin email allowlist, then an HMAC-signed PIN cookie (lib/admin-gate.ts).","paths":["lib/super-admin.ts"],"tags":["human","privileged"]},{"id":"native-shell","label":"Capacitor native shell","layer":"actors","order":5,"kind":"actor","summary":"iOS/Android wrapper that loads the deployed web app over https rather than bundling a static export.","detail":"A static export is not viable (SSR + 157 route handlers + middleware), so capacitor.config.ts points server.url at the production domain and allowlists only that origin plus *.supabase.co.","paths":["capacitor.config.ts","codemagic.yaml","MOBILE.md"],"tags":["mobile"]},{"id":"calendar-client","label":"Calendar app","layer":"actors","order":6,"kind":"actor","summary":"Google / Apple / Outlook subscribing to the read-only iCal feed.","detail":"Calendar clients cannot send auth headers, so the feed is protected only by profiles.calendar_token in the URL.","tags":["machine"]},{"id":"vercel-cron","label":"Vercel Cron","layer":"actors","order":7,"kind":"actor","summary":"Daily 08:07 UTC trigger declared in vercel.json.","detail":"Hits /api/cron/compliance-reminders. Authenticated by the x-vercel-cron header, or CRON_SECRET when called manually.","paths":["vercel.json"],"tags":["machine","scheduled"]},{"id":"middleware","label":"middleware.ts","layer":"edge","order":0,"kind":"edge","summary":"Runs on every non-asset request: refreshes the Supabase cookie session and redirects based on auth state.","detail":"Protects /dashboard, /projects, /directory, /approvals, /settings. Logged-out root goes to /homepage; logged-in visitors on /login, /signup or / go to /dashboard. Cookie writes are mirrored onto the response so the session stays fresh.","paths":["middleware.ts"],"tags":["auth","routing"]},{"id":"shell-marketing","label":"/homepage (marketing)","layer":"shell","order":0,"kind":"shell","summary":"Public marketing site: features, workflow walkthrough, AI, pricing, security, GC and sub audience pages, legal.","detail":"16 pages plus a bespoke component kit (scroll hero, phone fan, device mocks, stat marquee). Also drives robots.ts, sitemap.ts and OG/Twitter image routes.","paths":["app/homepage/**","components/marketing/**","app/sitemap.ts","app/robots.ts","app/opengraph-image.tsx"],"tags":["public"]},{"id":"shell-auth","label":"(auth) shell","layer":"shell","order":1,"kind":"shell","summary":"Login, signup, forgot-password, reset-password and the OAuth/magic-link callback.","paths":["app/(auth)/**","app/auth/callback/page.tsx"],"tags":["auth"]},{"id":"shell-dashboard","label":"(dashboard) shell","layer":"shell","order":2,"kind":"shell","summary":"The office app frame: sidebar, top nav, impersonation and view-as banners, idle logout, delete-guard provider.","detail":"Server component. Redirects unauthenticated users to /login and FIELD_ROLES users to /field. All chrome is print:hidden so invoice / pay-app / proposal print views render clean.","paths":["app/(dashboard)/layout.tsx","components/layout/**"],"tags":["authenticated"]},{"id":"shell-field","label":"/field (Field Mode)","layer":"shell","order":3,"kind":"shell","summary":"Dedicated mobile shell for field workers: no sidebar, no project tabs, no company money.","detail":"Bottom nav only. Office roles that land here bounce to /dashboard; admins and managers may enter to preview it.","paths":["app/field/layout.tsx","app/field/field-nav.tsx"],"tags":["mobile","authenticated"]},{"id":"shell-admin","label":"/admin console","layer":"shell","order":4,"kind":"shell","summary":"Platform-owner console behind a PIN gate: companies, users, projects, access requests, audit log.","paths":["app/admin/layout.tsx","components/admin/admin-pin-gate.tsx","components/admin/admin-nav.tsx"],"tags":["privileged"]},{"id":"shell-public","label":"Token pages (no auth)","layer":"shell","order":5,"kind":"shell","summary":"Standalone pages reached by secret link: /bid/[token], /rfi/[token], /compliance/[token], /portal/[token].","detail":"Rendered outside every authenticated layout. Each one talks to its matching public API route.","paths":["app/bid/[token]/page.tsx","app/rfi/[token]/page.tsx","app/compliance/[token]/page.tsx","app/portal/[token]/page.tsx"],"tags":["public"]},{"id":"ui-dashboard","label":"Dashboard & cross-project","layer":"ui","order":0,"kind":"page","summary":"Home dashboard, Master Calendar and Master Money.","detail":"Stat cards, cash-in vs cash-out chart, this-week agenda, recent projects and the Recent Activity drawer. Master views roll every job into one calendar and one money sheet.","paths":["app/(dashboard)/dashboard/page.tsx","app/(dashboard)/master-calendar/page.tsx","app/(dashboard)/master-money/page.tsx","components/dashboard/admin-overview.tsx","components/layout/activity-drawer.tsx"]},{"id":"ui-projects","label":"Projects list / map / new","layer":"ui","order":1,"kind":"page","summary":"Grid, list and Leaflet map of every job, plus the create-project form.","detail":"Search by name/address/client, filter by status and type, edit inline (including sq ft and billing mode), delete with confirmation. Address autocomplete + geocoding drops map pins.","paths":["app/(dashboard)/projects/page.tsx","app/(dashboard)/projects/new/page.tsx","components/projects/projects-map.tsx","components/ui/address-autocomplete.tsx"]},{"id":"ui-proj-field","label":"Project · Field tabs","layer":"ui","order":2,"kind":"page","summary":"Plans, Schedule, Tasks, Progress, Daily Logs, Time Clock.","detail":"Plan viewer with zoom and pins, schedule with crew-overlap warnings, tasks with sign-off, daily logs with photos and PDF export, weekly timesheets with approval.","paths":["app/(dashboard)/projects/[id]/plans/**","app/(dashboard)/projects/[id]/schedule/page.tsx","app/(dashboard)/projects/[id]/tasks/page.tsx","app/(dashboard)/projects/[id]/progress/page.tsx","app/(dashboard)/projects/[id]/daily-logs/page.tsx","app/(dashboard)/projects/[id]/time/page.tsx"]},{"id":"ui-proj-people","label":"Project · People tabs","layer":"ui","order":3,"kind":"page","summary":"Team, Bids, RFIs.","detail":"Team assignment drives assigned-only scoping for field roles. Bids covers packages, invitations, reminders and awards. RFIs can carry change-order proposals.","paths":["app/(dashboard)/projects/[id]/team/page.tsx","app/(dashboard)/projects/[id]/bids/page.tsx","app/(dashboard)/projects/[id]/rfis/page.tsx"]},{"id":"ui-proj-money","label":"Project · Money tabs","layer":"ui","order":4,"kind":"page","summary":"Budget, Invoices, Pay Apps, Payments, Request Quotes, Compare Quotes, Financials, Change Orders.","detail":"Which tabs appear depends on the project's billing_mode: Simple invoicing shows Invoices + Payments, AIA progress billing shows Pay Apps with retainage.","paths":["app/(dashboard)/projects/[id]/budget/page.tsx","app/(dashboard)/projects/[id]/invoices/page.tsx","app/(dashboard)/projects/[id]/pay-apps/page.tsx","app/(dashboard)/projects/[id]/payments/page.tsx","app/(dashboard)/projects/[id]/quotes/page.tsx","app/(dashboard)/projects/[id]/request-quotes/page.tsx","app/(dashboard)/projects/[id]/financials/page.tsx","app/(dashboard)/projects/[id]/change-orders/page.tsx","components/quotes/comparison-block.tsx","components/ui/bid-leveling-modal.tsx"]},{"id":"ui-proj-compliance","label":"Project · Compliance tabs","layer":"ui","order":5,"kind":"page","summary":"Permits, Inspections, Submittals, Compliance, Reports.","paths":["app/(dashboard)/projects/[id]/permits/page.tsx","app/(dashboard)/projects/[id]/inspections/page.tsx","app/(dashboard)/projects/[id]/submittals/page.tsx","app/(dashboard)/projects/[id]/compliance/page.tsx","app/(dashboard)/projects/[id]/reports/page.tsx"]},{"id":"ui-workspace","label":"Workspace tools","layer":"ui","order":6,"kind":"page","summary":"Directory, Customers, Files, Equipment, Materials, Approvals.","detail":"Company-wide, not project-scoped. Approvals is the single inbox for anything awaiting a decision; Materials is the receipt-scanning surface.","paths":["app/(dashboard)/directory/page.tsx","app/(dashboard)/customers/**","app/(dashboard)/files/page.tsx","app/(dashboard)/equipment/page.tsx","app/(dashboard)/materials/page.tsx","app/(dashboard)/approvals/page.tsx","components/materials/materials-view.tsx"]},{"id":"ui-sub","label":"My Bids / My Jobs","layer":"ui","order":7,"kind":"page","summary":"The subcontractor side of the app: incoming invites and awarded work across every GC.","detail":"Subs submit and revise quotes with line items and payment terms, then track scope, schedule and payment stages, and mark work Ready for Inspection.","paths":["app/(dashboard)/my-bids/**","app/(dashboard)/my-jobs/**","components/projects/sub-schedule.tsx"]},{"id":"ui-settings","label":"Settings & permissions","layer":"ui","order":8,"kind":"page","summary":"Company profile and logo, team invites, the permission grid, custom role classes, delete-protection key, budget templates, QuickBooks card, calendar connect.","paths":["app/(dashboard)/settings/page.tsx","app/(dashboard)/budget-templates/page.tsx","components/settings/permissions-panel.tsx","components/settings/quickbooks-card.tsx","components/calendar/connect-calendar.tsx"]},{"id":"ui-help","label":"Help Center","layer":"ui","order":9,"kind":"page","summary":"40+ support articles with client-side keyword search, kept in sync with every feature change.","detail":"Article content is a typed data structure in lib/help/articles.ts, not a CMS.","paths":["app/(dashboard)/help/page.tsx","lib/help/articles.ts"]},{"id":"ui-print","label":"Print / PDF views","layer":"ui","order":10,"kind":"page","summary":"Printable invoice, pay application (G702/G703) and proposal pages.","detail":"Rendered inside the dashboard shell with all chrome hidden by print: variants, so browser print or save-as-PDF gives a clean document.","paths":["app/(dashboard)/projects/[id]/invoices/[invoiceId]/print/page.tsx","app/(dashboard)/projects/[id]/pay-apps/[appId]/print/page.tsx","app/(dashboard)/projects/[id]/proposal/print/page.tsx"]},{"id":"ui-field-pages","label":"Field Mode pages","layer":"ui","order":11,"kind":"page","summary":"Today, Tasks, Log and Me: the four screens a field worker gets.","detail":"Clock card with selfie capture and GPS, task rows with one-tap status, quick daily-log filing.","paths":["app/field/page.tsx","app/field/tasks/page.tsx","app/field/log/page.tsx","app/field/me/page.tsx","app/field/clock-card.tsx","app/field/task-row.tsx","components/ui/camera-capture.tsx"]},{"id":"ui-admin-pages","label":"Admin console pages","layer":"ui","order":12,"kind":"page","summary":"Platform stats, companies, users, projects, access requests, impersonation audit.","paths":["app/admin/page.tsx","app/admin/companies/page.tsx","app/admin/users/page.tsx","app/admin/projects/page.tsx","app/admin/access-requests/page.tsx","app/admin/audit/page.tsx"]},{"id":"hook-permissions","label":"usePermissions + View As","layer":"ui","order":13,"kind":"hook","summary":"Client hook that loads the caller's effective permission map and exposes can(resource, action).","detail":"Reads localStorage keys workos_view_as_role / workos_view_as_user so admins can preview the app as another role or a specific teammate; the preview is resolved server-side by /api/me/permissions.","paths":["lib/use-permissions.ts","components/layout/view-as-switcher.tsx"]},{"id":"hook-viewer","label":"useViewerContext","layer":"ui","order":14,"kind":"hook","summary":"Tells a project screen whether the viewer's company owns the job and what company type they are.","detail":"Switches sub-specific rendering, e.g. a sub's standalone job where quote line items are the budget.","paths":["lib/use-viewer-context.ts"]},{"id":"sb-browser","label":"Supabase browser client","layer":"ui","order":15,"kind":"hook","summary":"createBrowserClient from @supabase/ssr. Owns the session and mints the bearer token every fetch attaches.","paths":["lib/supabase/client.ts","lib/admin-fetch.ts"]},{"id":"api-me","label":"/api/me/*","layer":"api","order":0,"kind":"api","summary":"permissions and tasks for the signed-in user.","detail":"/api/me/permissions is the authoritative permission resolver: role defaults -> company_roles overrides (including custom classes) -> per-user permission_overrides, with admin-only as_user / as preview parameters.","paths":["app/api/me/permissions/route.ts","app/api/me/tasks/route.ts"]},{"id":"api-dashboard","label":"/api/dashboard/*, /api/master/*","layer":"api","order":1,"kind":"api","summary":"Cross-project rollups: overview, stats, activity feed, master calendar, master money.","paths":["app/api/dashboard/overview/route.ts","app/api/dashboard/stats/route.ts","app/api/dashboard/activity/route.ts","app/api/master/calendar/route.ts","app/api/master/money/route.ts"]},{"id":"api-projects-core","label":"/api/projects (core)","layer":"api","order":2,"kind":"api","summary":"Project CRUD, bulk actions, stats, geocoding, per-project activity, viewer context, portal token minting.","detail":"app/api/projects/route.ts is the one handler that fully applies the server-side permission grid via getActor/actorCan.","paths":["app/api/projects/route.ts","app/api/projects/[id]/route.ts","app/api/projects/bulk/route.ts","app/api/projects/stats/route.ts","app/api/projects/geocode/route.ts","app/api/projects/[id]/activity/route.ts","app/api/projects/[id]/viewer-context/route.ts","app/api/projects/[id]/portal-token/route.ts"]},{"id":"api-field","label":"/api/projects/[id] field routes","layer":"api","order":3,"kind":"api","summary":"Plans and folders, plan pins, schedule, job schedule, tasks and notes, daily logs with photos and PDF, time clock.","detail":"Includes the geofenced punch endpoint and the payroll hours export.","paths":["app/api/projects/[id]/plans/**","app/api/projects/[id]/schedule/**","app/api/projects/[id]/job-schedule/route.ts","app/api/projects/[id]/tasks/**","app/api/projects/[id]/daily-logs/**","app/api/projects/[id]/time/**"]},{"id":"api-bidding","label":"Bidding & quotes API","layer":"api","order":4,"kind":"api","summary":"Bid requests and invites, bid packages, remind/revise, award, quote comparisons and awards, subcontracts.","paths":["app/api/projects/[id]/bid-requests/**","app/api/projects/[id]/bids/**","app/api/projects/[id]/quotes/**","app/api/projects/[id]/quote/route.ts","app/api/projects/[id]/subcontracts/**"]},{"id":"api-money","label":"Money API","layer":"api","order":5,"kind":"api","summary":"Budget lines and sign-offs, budget templates, invoices with documents and lien waivers, pay applications, client payments, change orders, financials, materials.","detail":"Pay-app creation carries previous_completed forward from prior applications and defaults retainage from the project or company setting.","paths":["app/api/projects/[id]/budget/**","app/api/budget-templates/**","app/api/projects/[id]/invoices/**","app/api/projects/[id]/pay-apps/**","app/api/projects/[id]/payments/**","app/api/projects/[id]/change-orders/**","app/api/projects/[id]/financials/route.ts","app/api/materials/**"]},{"id":"api-compliance","label":"Compliance API","layer":"api","order":6,"kind":"api","summary":"Permits, inspections and inspection cards, submittals, compliance documents and email requests.","paths":["app/api/projects/[id]/permits/**","app/api/projects/[id]/inspections/**","app/api/projects/[id]/submittals/**","app/api/projects/[id]/compliance/**"]},{"id":"api-workspace","label":"Workspace API","layer":"api","order":7,"kind":"api","summary":"Customers, directory companies and profiles, files and file packets, equipment and assignments, notifications, approvals inbox.","paths":["app/api/customers/**","app/api/directory/**","app/api/files/**","app/api/equipment/**","app/api/notifications/**","app/api/approvals/route.ts"]},{"id":"api-search","label":"/api/search","layer":"api","order":8,"kind":"api","summary":"Global search across projects, customers, companies, files and more, returned as grouped hits with hrefs.","detail":"Escapes PostgREST or() reserved characters so a query containing a comma or percent sign cannot break the filter string.","paths":["app/api/search/route.ts","components/layout/global-search.tsx"]},{"id":"api-sub","label":"/api/my-bids, /api/my-jobs","layer":"api","order":9,"kind":"api","summary":"The subcontractor's cross-GC view of invites and awarded jobs.","paths":["app/api/my-bids/**","app/api/my-jobs/**"]},{"id":"api-settings","label":"Settings & onboarding API","layer":"api","order":10,"kind":"api","summary":"Company settings, logo, teammates, member roles and per-user permission overrides, custom role classes, calendar token, delete-key verification, invites, signup completion, access requests.","detail":"The settings permission endpoints are among the few that re-check authorization on the server.","paths":["app/api/settings/**","app/api/invite/**","app/api/complete-signup/route.ts","app/api/access-request/route.ts"]},{"id":"api-admin","label":"/api/admin/*","layer":"api","order":11,"kind":"api","summary":"Platform stats, companies, users, projects, access requests, audit, PIN verification and impersonation.","detail":"Impersonation mints a one-time magic-link token_hash for the target user so the browser gets a real session. Also hosts /api/dev/seed-demo behind DEMO_SEED_SECRET.","paths":["app/api/admin/**","app/api/dev/seed-demo/route.ts","lib/seed-demo.ts"]},{"id":"api-ai","label":"AI extraction endpoints","layer":"api","order":12,"kind":"api","summary":"The 11 handlers that send a document or photo to Claude and return a reviewable draft.","detail":"Quote scan, bid-request to comparison, quote gap analysis, subcontractor proposal analysis, material receipt scan, permit scan, compliance document scan, inspection card, submittal analysis. All use model claude-opus-4-8 with base64 image or PDF document blocks, strip code fences, and fall back to null on any parse failure rather than throwing.","paths":["app/api/projects/[id]/quote/route.ts","app/api/projects/[id]/quotes/[compId]/analyze/route.ts","app/api/projects/[id]/quotes/[compId]/upload/route.ts","app/api/projects/[id]/bid-requests/[reqId]/to-comparison/route.ts","app/api/projects/[id]/subcontracts/analyze-proposal/route.ts","app/api/materials/scan/route.ts","app/api/projects/[id]/permits/analyze/route.ts","app/api/projects/[id]/compliance/analyze/route.ts","app/api/projects/[id]/inspections/analyze/route.ts","app/api/projects/[id]/inspections/[inspectionId]/card/route.ts","app/api/projects/[id]/submittals/analyze/route.ts"]},{"id":"api-public","label":"Public token API","layer":"api","order":13,"kind":"api","summary":"Unauthenticated endpoints backing the token pages: bid submission, RFI answer, compliance upload.","detail":"Each looks the token up, marks it viewed on first open, and accepts a submission. No session is ever created.","paths":["app/api/bid/[token]/route.ts","app/api/rfi/[token]/route.ts","app/api/compliance/[token]/route.ts"]},{"id":"api-calendar","label":"/api/calendar/[token]","layer":"api","order":14,"kind":"api","summary":"Read-only iCal feed keyed by profiles.calendar_token.","detail":"Emits escaped VEVENTs for project dates so Google/Apple/Outlook can subscribe.","paths":["app/api/calendar/[token]/route.ts","app/api/settings/calendar/route.ts"]},{"id":"api-cron","label":"/api/cron/compliance-reminders","layer":"api","order":15,"kind":"api","summary":"Daily sweep for compliance documents expiring within 30 days.","detail":"Notifies every profile at the owning company, then stamps reminder_sent_at and flips status to expiring_soon so a document only fires once per expiry cycle.","paths":["app/api/cron/compliance-reminders/route.ts"]},{"id":"api-integrations","label":"Integration proxies","layer":"api","order":16,"kind":"api","summary":"QuickBooks OAuth and sync, address autocomplete and details, weather.","detail":"Every third-party key stays server-side; the browser only ever talks to these proxies.","paths":["app/api/quickbooks/**","app/api/geo/autocomplete/route.ts","app/api/geo/details/route.ts","app/api/weather/route.ts"]},{"id":"lib-permissions","label":"lib/permissions.ts","layer":"domain","order":0,"kind":"lib","summary":"The permission model: 32 resources in 6 groups x view/create/edit/delete, plus role defaults for admin, manager, project_manager, office_staff, field_supervisor, worker, member and read_only.","detail":"Also defines ASSIGNED_ONLY_ROLES (field roles see only projects they are on) and FIELD_ROLES (who gets Field Mode). resolveRoleBase layers a company's company_roles row over the hardcoded defaults, or starts from all-none for a brand-new custom class.","paths":["lib/permissions.ts"]},{"id":"lib-server-perms","label":"lib/server-permissions.ts","layer":"domain","order":1,"kind":"lib","summary":"getActor(db, token) resolves a bearer token into { userId, role, companyId, permissions }; actorCan gates an action.","detail":"Mirrors /api/me/permissions exactly so what the UI hides is what the API refuses. Currently wired into app/api/projects/route.ts.","paths":["lib/server-permissions.ts"]},{"id":"lib-activity","label":"lib/log-activity.ts","layer":"domain","order":2,"kind":"lib","summary":"Single writer for the project_activity event log.","detail":"Called from ~40 handlers covering RFIs, change orders, invoices, tasks, awards, permits, inspections, submittals, daily logs, subcontracts, bid packages, receipts, payments, equipment, punches, team changes and budget edits.","paths":["lib/log-activity.ts"]},{"id":"lib-notify","label":"lib/notify.ts","layer":"domain","order":3,"kind":"lib","summary":"Inserts an in-app notification row for a user.","detail":"Feeds the notification bell. Types include task_assigned, bid_awarded, invoice_approved, compliance_expiring.","paths":["lib/notify.ts","components/layout/notification-bell.tsx"]},{"id":"lib-admin-gate","label":"lib/admin-gate.ts","layer":"domain","order":4,"kind":"lib","summary":"HMAC-signs the /admin PIN cookie against the user id so it cannot be forged or reused by another account.","detail":"Verified with timingSafeEqual. Secret is SUPABASE_SERVICE_ROLE_KEY.","paths":["lib/admin-gate.ts"]},{"id":"lib-super-admin","label":"lib/super-admin.ts","layer":"domain","order":5,"kind":"lib","summary":"Hardcoded allowlist of platform-owner emails permitted to impersonate any account.","paths":["lib/super-admin.ts"]},{"id":"lib-delete-key","label":"lib/delete-key.ts","layer":"domain","order":6,"kind":"lib","summary":"SHA-256 of the company's secret delete key, checked before destructive actions when delete protection is on.","paths":["lib/delete-key.ts","components/ui/delete-guard.tsx"]},{"id":"lib-compliance-extract","label":"lib/compliance-extract.ts","layer":"domain","order":7,"kind":"lib","summary":"Normalises AI output for insurance certificates and licences into typed fields plus a human summary.","paths":["lib/compliance-extract.ts"]},{"id":"lib-quickbooks","label":"lib/quickbooks.ts","layer":"domain","order":8,"kind":"lib","summary":"QuickBooks Online OAuth2 and API helper: authorize URL, token exchange and refresh, sandbox/production base URLs, minor version 73.","detail":"Phase 1 is a one-way push from SyteNav to QBO. Requires QBO_CLIENT_ID and QBO_CLIENT_SECRET; qboConfigured() lets the UI degrade gracefully when they are absent.","paths":["lib/quickbooks.ts"]},{"id":"sb-service","label":"Service-role client","layer":"domain","order":9,"kind":"lib","summary":"createClient(URL, SUPABASE_SERVICE_ROLE_KEY) instantiated per handler in 149 of 157 routes.","detail":"Bypasses row-level security, so any tenant scoping must be written into the query. The cookie-based server client (lib/supabase/server.ts) is used by the four server components that need the session.","paths":["lib/supabase/server.ts"]},{"id":"sb-auth","label":"Supabase Auth","layer":"data","order":0,"kind":"store","summary":"Email/password sessions, password reset, magic links (also used to mint impersonation sessions).","detail":"Cookie session refreshed by middleware; route handlers verify the bearer access token.","paths":[]},{"id":"db-identity","label":"Identity & company tables","layer":"data","order":1,"kind":"store","summary":"profiles, companies, company_roles, company_invites, access_requests, impersonation_log, contacts, customers.","detail":"profiles carries role, company_id, permission_overrides (jsonb), phone and calendar_token. company_roles stores per-company overrides of role defaults and custom classes.","tables":["profiles","companies","company_roles","company_invites","access_requests","impersonation_log","contacts","customers"]},{"id":"db-projects","label":"Project tables","layer":"data","order":2,"kind":"store","summary":"projects, project_team_members, project_activity.","detail":"projects holds status, type, address, latitude/longitude, interior/exterior sq ft, billing_mode, default_retainage_pct, quote file and totals, payment_stages and client_portal_token.","tables":["projects","project_team_members","project_activity"]},{"id":"db-field","label":"Field tables","layer":"data","order":3,"kind":"store","summary":"project_plans, plan_folders, plan_pins, tasks, project_tasks, task_notes, schedule_items, daily_logs, daily_log_photos, daily_log_updates, daily_log_attachments, time_entries, equipment, equipment_assignments.","tables":["project_plans","plan_folders","plan_pins","tasks","project_tasks","task_n ion tables","layer":"data","order":7,"kind":"store","summary":"notifications, company_files, file_packets, quickbooks_connections, quickbooks_oauth_states, quickbooks_sync_log.","tables":["notifications","company_files","file_packets","quickbooks_connections","quickbooks_oauth_states","quickbooks_sync_log"]},{"id":"storage","label":"Supabase Storage","layer":"data","order":8,"kind":"store","summary":"Buckets for plans, photos, receipts, submittals, signatures, logos and generated documents.","detail":"Named buckets in code include daily-log-photos (also used for clock-in selfies), submittals, company-files, plans, signatures, lien-waivers, proposals and rfi-attachments. Files are handed out as long-lived signed URLs.","paths":[]},{"id":"ext-claude","label":"Anthropic Claude API","layer":"external","order":0,"kind":"external","summary":"Reads quotes, receipts, invoices, permits, insurance certificates and submittals from PDFs and phone photos.","detail":"model claude-opus-4-8, max_tokens up to 8192, base64 document/image content blocks. Requires ANTHROPIC_API_KEY.","paths":[]},{"id":"ext-qbo","label":"QuickBooks Online","layer":"external","order":1,"kind":"external","summary":"Intuit OAuth2 plus the accounting API (sandbox or production).","detail":"Scope com.intuit.quickbooks.accounting. Env: QBO_CLIENT_ID, QBO_CLIENT_SECRET, QBO_ENV, QBO_REDIRECT_URI.","paths":[]},{"id":"ext-google-places","label":"Google Places","layer":"external","order":2,"kind":"external","summary":"Primary address autocomplete and place details (US + CA), used because it catches new construction and new roads.","detail":"Behind GOOGLE_MAPS_API_KEY. On REQUEST_DENIED or quota errors the proxy silently falls through to Photon.","paths":[]},{"id":"ext-photon","label":"Photon (OpenStreetMap)","layer":"external","order":3,"kind":"external","summary":"Free autocomplete fallback when no Google key is configured or Google errors.","paths":[]},{"id":"ext-nominatim","label":"Nominatim","layer":"external
