ity","kind":"query"},{"id":"e-notify-db","from":"lib-notify","to":"db-ops","label":"insert notifications","kind":"query"},{"id":"e-service-identity","from":"sb-service","to":"db-identity","label":"profiles / companies","kind":"query"},{"id":"e-service-projects","from":"sb-service","to":"db-projects","label":"projects / team","kind":"query"},{"id":"e-service-field","from":"sb-service","to":"db-field","label":"plans / tasks / logs / time","kind":"query"},{"id":"e-service-bidding","from":"sb-service","to":"db-bidding","label":"bids / quotes / subcontracts","kind":"query"},{"id":"e-service-money","from":"sb-service","to":"db-money","label":"budget / invoices / payments","kind":"query"},{"id":"e-service-compliance","from":"sb-service","to":"db-compliance","label":"permits / docs / RFIs","kind":"query"},{"id":"e-service-ops","from":"sb-service","to":"db-ops","label":"files / notifications / QBO","kind":"query"},{"id":"e-service-storage","from":"sb-service","to":"storage","label":"upload + signed URLs","kind":"storage"},{"id":"e-me-identity","from":"api-me","to":"db-identity","label":"profiles + company_roles","kind":"query"},{"id":"e-cron-compliance","from":"api-cron","to":"db-compliance","label":"expiring docs + stamp reminder","kind":"query"},{"id":"e-calendar-db","from":"api-calendar","to":"db-projects","label":"dates by calendar_token","kind":"query"},{"id":"e-admin-auth","from":"api-admin","to":"sb-auth","label":"generateLink (impersonate)","kind":"query"},{"id":"e-search-db","from":"api-search","to":"db-projects","label":"grouped hits","kind":"query"},{"id":"e-sub-db","from":"api-sub","to":"db-bidding","label":"invites + awarded work","kind":"query"},{"id":"e-dashboard-db","from":"api-dashboard","to":"db-money","label":"cash in / out rollup","kind":"query"},{"id":"e-workspace-db","from":"api-workspace","to":"db-ops","label":"files / equipment / notifications","kind":"query"},{"id":"e-settings-db","from":"api-settings","to":"db-identity","label":"company / roles / invites","kind":"query"},{"id":"e-ai-storage","from":"api-ai","to":"storage","label":"read the uploaded file","kind":"storage"},{"id":"e-ai-claude","from":"api-ai","to":"ext-claude","label":"messages.create (PDF/image)","kind":"external"},{"id":"e-qbo-ext","from":"lib-quickbooks","to":"ext-qbo","label":"OAuth2 + accounting API","kind":"external"},{"id":"e-geo-google","from":"api-integrations","to":"ext-google-places","label":"autocomplete / details","kind":"external"},{"id":"e-geo-photon","from":"api-integrations","to":"ext-photon","label":"fallback autocomplete","kind":"external"},{"id":"e-weather-ext","from":"api-integrations","to":"ext-open-meteo","label":"current conditions","kind":"external"},{"id":"e-punch-nominatim","from":"api-field","to":"ext-nominatim","label":"geocode job site once","kind":"external"},{"id":"e-vercel-host","from":"ext-vercel","to":"middleware","label":"hosts the app","kind":"external"}],"flows":[{"id":"flow-auth","name":"Sign in and session routing","category":"Access","summary":"How a request becomes a session, and where each role lands.","steps":[{"n":1,"node":"actor-office","edge":"e-office-mw","title":"Request arrives","detail":"Any non-asset path matches the middleware matcher."},{"n":2,"node":"middleware","edge":"e-mw-auth-check","title":"Resolve the session","detail":"createServerClient reads the request cookies, calls auth.getUser(), and mirrors any refreshed cookies onto the response."},{"n":3,"node":"sb-auth","edge":"e-mw-authshell","title":"No user on a protected route","detail":"/dashboard, /projects, /directory, /approvals and /settings redirect to /login. A logged-out visitor on / goes to /homepage instead."},{"n":4,"node":"shell-auth","edge":"e-authshell-auth","title":"Sign in","detail":"The login page calls signInWithPassword on the browser client."},{"n":5,"node":"sb-browser","edge":"e-sbbrowser-auth","title":"Session established","detail":"Supabase sets the cookie session; the access token becomes the bearer token every subsequent fetch attaches."},{"n":6,"node":"shell-dashboard","edge":"e-mw-dashboard","title":"Land in the office app","detail":"Middleware sends an authenticated visitor on /, /login or /signup to /dashboard."},{"n":7,"node":"shell-field","edge":"e-dash-field-redirect","title":"Unless they are field crew","detail":"The dashboard layout reads profiles.role and redirects FIELD_ROLES ('worker', 'member') to /field."}]},{"id":"flow-perms","name":"Permission resolution","category":"Access","summary":"Role defaults, company overrides and per-user overrides collapse into one effective grid.","steps":[{"n":1,"node":"hook-permissions","edge":"e-perms-api","title":"Client asks for its grid","detail":"usePermissions fetches /api/me/permissions with the bearer token, appending as_user or as when an admin is previewing."},{"n":2,"node":"api-me","edge":"e-me-identity","title":"Load the profile","detail":"Reads role, permission_overrides and company_id, degrading to role-only if the overrides column is missing."},{"n":3,"node":"db-identity","edge":"e-me-perms","title":"Layer the company's roles","detail":"company_roles rows for this company override the hardcoded defaults and define custom classes."},{"n":4,"node":"lib-permissions","title":"Compute the effective map","detail":"resolveRoleBase picks the base map, then getEffectivePermissions applies per-user overrides resource by resource."},{"n":5,"node":"shell-dashboard","edge":"e-shell-perms","title":"UI hides what you cannot do","detail":"can(resource, action) gates sidebar entries, project tabs and buttons. ASSIGNED_ONLY_ROLES additionally see only projects they are on."},{"n":6,"node":"api-projects-core","edge":"e-projects-actor","title":"Server re-check","detail":"getActor/actorCan mirror the same resolution so the API refuses what the UI hid. Wired into app/api/projects/route.ts and the settings permission endpoints; other handlers authenticate and scope by company rather than consulting the grid."}]},{"id":"flow-quote-scan","name":"AI quote scan builds the job","category":"AI","summary":"A photo or PDF of a contractor's estimate becomes budget lines and a payment schedule.","steps":[{"n":1,"node":"ui-proj-money","edge":"e-money-ai","title":"Upload the quote","detail":"The Quote tab accepts a PDF or a phone photo of the estimate."},{"n":2,"node":"api-ai","edge":"e-ai-storage","title":"Store and read the file","detail":"The file lands in Storage; the handler fetches it back as a buffer and picks a PDF document block or an image block by content type."},{"n":3,"node":"ext-claude","edge":"e-ai-claude","title":"Extract structure","detail":"claude-opus-4-8 returns JSON: total_amount, payment_terms, ordered payment_stages, and line_items with section, quantity, unit_price and amount. Code fences are stripped and the JSON is sliced between the outer braces; any failure returns null rather than throwing."},{"n":4,"node":"api-ai","title":"Backfill older quotes","detail":"parseTerms() splits a free-text payment-terms paragraph into stages, so quotes scanned before structured stages existed still render as a schedule."},{"n":5,"node":"ui-proj-money","title":"User reviews the draft","detail":"Nothing is saved until the numbers are checked and edited on screen."},{"n":6,"node":"db-money","edge":"e-service-money","title":"Write the budget","detail":"Accepted lines become budget_line_items with sort_order; stages become the project's payment_stages."}]},{"id":"flow-bid-request","name":"Request quotes from subs","category":"Bidding","summary":"Build a bid package, invite subs from the Directory, track who looked.","steps":[{"n":1,"node":"ui-proj-people","edge":"e-people-api","title":"Create the package","detail":"Scope, trade, description, due date and attachments."},{"n":2,"node":"api-bidding","edge":"e-bidding-service","title":"Persist it","detail":"bid_requests plus bid_request_attachments (or the older bid_packages set)."},{"n":3,"node":"db-bidding","title":"Invite subs","detail":"One bid_invites row per invited company, each carrying an unguessable token."},{"n":4,"node":"actor-sub","edge":"e-guest-mw","title":"Sub opens the link","detail":"/bid/[token] needs no account."},{"n":5,"node":"api-public","edge":"e-public-api","title":"Mark viewed","detail":"First open flips the invite from 'invited' to 'viewed' and stamps viewed_at, which is what the GC's tracker shows."},{"n":6,"node":"ui-proj-people","title":"Nudge and revise","detail":"Remind and revision-request actions re-notify the sub without recreating the package."}]},{"id":"flow-sub-submit","name":"Sub submits a bid without an account","category":"Bidding","summary":"The public token page is a full quote builder.","steps":[{"n":1,"node":"actor-guest","edge":"e-guest-mw","title":"Open the token link","detail":"Middleware lets it through; no protected prefix matches."},{"n":2,"node":"shell-public","edge":"e-public-api","title":"Load the request","detail":"GET /api/bid/[token] returns the package, project name and address, attachments, and any previous submission by this invite."},{"n":3,"node":"api-public","edge":"e-public-service","title":"Submit","detail":"Line items with quantities, unit prices, sections and payment terms are written as a bid_submissions row."},{"n":4,"node":"db-bidding","edge":"e-public-activity","title":"Tell the GC","detail":"The submission is logged to project_activity and surfaces on the Request Quotes tab, where to-comparison turns the submissions into a quote_comparisons set for side-by-side review."},{"n":5,"node":"ui-sub","edge":"e-sub-api","title":"Registered subs also get it in-app","detail":"Inviting a Directory sub that has an account notifies every profile at that company, and /api/my-bids returns a quote_requests array built from bid_invites (matched on vendor_company_id) alongside the older bid_invitations set. My Bids lists them under 'Quote requests' linking to /bid/\u003ctoken>, since the token page is still where the quote is built. Before this, the newer Request Quotes tables were invisible to logged-in subs and the emailed link was the only way in."}]},{"id":"flow-award","name":"Award a bid (the cascade)","category":"Bidding","summary":"One click writes the subcontract, the payment schedule, the schedule bar, the notification and the activity entry.","steps":[{"n":1,"node":"ui-proj-people","edge":"e-people-api","title":"Award the winner","detail":"POST /api/projects/[id]/bids/[packageId]/award with the winning bid_id."},{"n":2,"node":"api-bidding","edge":"e-bidding-service","title":"Settle the package","detail":"Winner to 'awarded', every other bid on the package to 'rejected', package to 'awarded' - all three in one Promise.all."},{"n":3,"node":"db-bidding","title":"Create the subcontract","detail":"A subcontracts row inherits scope, trade and contract_amount from the bid."},{"n":4,"node":"db-money","edge":"e-service-money","title":"Stage the payments","detail":"The bid's payment_terms text is split line by line; a percent match becomes a percent stage with its dollar amount, anything else becomes a milestone, ordered by order_index."},{"n":5,"node":"db-field","edge":"e-service-field","title":"Put it on the schedule","detail":"If the bid carried duration_days and earliest_start_date, a schedule_items row is created for the date range."},{"n":6,"node":"lib-notify","edge":"e-bidding-notify","title":"Tell the sub","detail":"A bid_awarded notification lands for every profile at the sub's company. This used to end the query with .single(), which errors unless exactly one row comes back, so any sub with a second account got nothing."},{"n":7,"node":"lib-activity","edge":"e-bidding-activity","title":"Record it","detail":"project_activity gets 'Awarded \"scope\" to Company for $amount' with bid, package, company and amount in metadata."}]},{"id":"flow-invoice","name":"Vendor invoice to budget actuals","category":"Money","summary":"Approving (not paying) is what moves the money.","steps":[{"n":1,"node":"ui-proj-money","edge":"e-money-api","title":"Create the invoice","detail":"Against a subcontract, even when the sub has no account, or generated from line-item progress."},{"n":2,"node":"api-money","edge":"e-money-service","title":"Status flow","detail":"draft to approved to sent to paid, with client-paid vs escrow-paid split per invoice."},{"n":3,"node":"db-money","title":"Approval stamps the record","detail":"approved_at and approved_by_name are written, and the linked budget line's Actual accrues."},{"n":4,"node":"lib-notify","edge":"e-money-notify","title":"Notify the sub","detail":"An invoice_approved notification tells them the amount cleared review."},{"n":5,"node":"lib-activity","edge":"e-money-activity","title":"Log it","detail":"'Invoice N approved - $amount' on the project activity feed."},{"n":6,"node":"ui-print","edge":"e-print-money","title":"Print or attach","detail":"A printable invoice view, plus lien waiver attachments stored alongside."}]},{"id":"flow-payapp","name":"AIA pay application (G702/G703)","category":"Money","summary":"Monthly draws against the schedule of values, with retainage carried correctly.","steps":[{"n":1,"node":"ui-proj-money","edge":"e-money-api","title":"Start a draw","detail":"Only on projects whose billing_mode is progress billing; the Simple mode shows Invoices + Payments instead."},{"n":2,"node":"api-money","edge":"e-money-service","title":"Seed the lines","detail":"Every budget line becomes a pay_application_lines row with its scheduled_value."},{"n":3,"node":"db-money","title":"Carry previous work forward","detail":"Prior applications are summed per budget_line_item_id into previous_completed, so this period only asks for new work and stored materials."},{"n":4,"node":"api-money","title":"Compute G702","detail":"The detail route does the real thing: completed_to_date = previous + this period + stored, retainage = completed x retainage_pct, earned_less_retainage, then less_previous (prior certificates net of their retainage) to reach current_due, plus balance_to_finish. The list route deliberately skips the previous-certificates subtraction for its summary column, so a draw's current_due reads higher there than on the detail and print views. retainage_pct defaults from projects.default_retainage_pct, then the company default, then 10%."},{"n":5,"node":"ui-print","edge":"e-print-money","title":"Issue it","detail":"Draft to Submitted to Certified to Funded, with a printable G702 + G703 for the architect or bank. Works GC-to-owner and sub-to-GC."}]},{"id":"flow-payments","name":"Client payment and escrow","category":"Money","summary":"Money in, fee out, and what is safe to release to vendors.","steps":[{"n":1,"node":"ui-proj-money","edge":"e-money-api","title":"Record the payment","detail":"Date, amount, method, memo, retainer flag and a QuickBooks-entered flag."},{"n":2,"node":"api-money","edge":"e-money-service","title":"Store it","detail":"client_payments, scoped to the project."},{"n":3,"node":"db-money","title":"Run the math","detail":"Received, contractor fee %, fee earned, available after fee, vendor billed and paid, escrow balance, outstanding to vendors, and projected cost vs invoiced."},{"n":4,"node":"ui-proj-money","title":"Answer the real question","detail":"The summary states what is safe to release to vendors right now given escrow and outstanding balances."},{"n":5,"node":"api-dashboard","edge":"e-dashboard-db","title":"Roll it up","detail":"Master Money aggregates cash in vs out, escrow and outstanding across every job."}]},{"id":"flow-clock","name":"Clock in with selfie and geofence","category":"Field","summary":"A two-tap punch that is verifiable without being punitive.","steps":[{"n":1,"node":"ui-field-pages","edge":"e-fieldpages-api","title":"Tap clock in","detail":"The clock card captures a selfie and requests GPS, then posts multipart form data to /api/projects/[id]/time/punch. A punch without a selfie is rejected outright."},{"n":2,"node":"api-field","edge":"e-punch-nominatim","title":"Locate the job site","detail":"Uses projects.latitude/longitude if set; otherwise geocodes the address through Nominatim once and caches the result back onto the project row."},{"n":3,"node":"ext-nominatim","title":"Measure the distance","detail":"Haversine against a 250 m radius. Beyond it, or with no GPS at all, the punch is flagged for review - never rejected."},{"n":4,"node":"storage","edge":"e-service-storage","title":"Store the selfie","detail":"Uploaded to the daily-log-photos bucket under \u003cprojectId>/time/, then handed back as a long-lived signed URL."},{"n":5,"node":"db-field","edge":"e-service-field","title":"Write the entry","detail":"time_entries records coordinates, distance, the flag and the selfie URL. A second clock-in while one is open returns 409."},{"n":6,"node":"lib-activity","edge":"e-field-activity","title":"Show the office","detail":"A time_clock_in activity entry appears immediately, marked (flagged) when relevant. Weekly totals feed timesheet approval and the payroll export."}]},{"id":"flow-daily-log","name":"Daily log with photos and PDF","category":"Field","summary":"The day's record, filed from a phone in under a minute.","steps":[{"n":1,"node":"ui-field-pages","edge":"e-fieldpages-weather","title":"Prefill the weather","detail":"/api/weather resolves lat/lon or geocodes the address, then maps Open-Meteo WMO codes to sunny/cloudy/rainy/snowy, with wind at or above 20 mph overriding to windy."},{"n":2,"node":"ext-open-meteo","edge":"e-fieldpages-api","title":"File the log","detail":"Crew count, work performed, delays, visitors, and a signature."},{"n":3,"node":"api-field","edge":"e-service-storage","title":"Attach photos","detail":"Photos go to the daily-log-photos bucket with a category, and render as thumbnails that open in a lightbox."},{"n":4,"node":"db-field","edge":"e-service-field","title":"Record the author","detail":"daily_logs stores who filed it; migration 060 backfilled authors on existing rows."},{"n":5,"node":"api-field","title":"Follow-ups and export","detail":"daily_log_updates adds later comments; the PDF route renders the whole log with pdf-lib for sending on."}]},{"id":"flow-plan-pin","name":"Pin a task on the drawing","category":"Field","summary":"Click the exact spot on the plan; the task and the notification follow.","steps":[{"n":1,"node":"ui-proj-field","edge":"e-field-api","title":"Drop the pin","detail":"Click the spot in the plan viewer, describe the work, assign a teammate, set a due date."},{"n":2,"node":"api-field","edge":"e-service-field","title":"Create the task first","detail":"A project_tasks row is inserted, then the plan_pins row is created pointing at it - so removing the pin leaves the task intact."},{"n":3,"node":"db-field","title":"Anchor it","detail":"Pins store normalised coordinates so they stay put while zooming, and are colour-coded per assignee."},{"n":4,"node":"lib-notify","edge":"e-field-notify","title":"Tell the assignee","detail":"A task_assigned notification: 'You have been assigned a task from the plan'."},{"n":5,"node":"ui-field-pages","title":"It shows up in the field","detail":"The task appears in Field Mode's task list and on the project schedule; the pin list jumps the viewer back to the spot."}]},{"id":"flow-rfi","name":"RFI to answer link to change order","category":"Communication","summary":"A field question routed to whoever can actually answer it.","steps":[{"n":1,"node":"ui-proj-people","edge":"e-people-comp","title":"Raise the RFI","detail":"Numbered, with description and photo or file attachments. Subs can raise one through the portal without an account."},{"n":2,"node":"api-compliance","edge":"e-service-compliance","title":"Mint an answer link","detail":"rfis.answer_token backs a one-time public URL for the architect or designer."},{"n":3,"node":"actor-guest","edge":"e-guest-mw","title":"They answer","detail":"GET /api/rfi/[token] shows the question and attachments; the response and responder name are posted back. No account, no login."},{"n":4,"node":"api-public","edge":"e-public-activity","title":"Close the loop","detail":"The RFI flips to answered and the project activity feed records it."},{"n":5,"node":"ui-workspace","edge":"e-workspace-api","title":"Route the cost","detail":"An RFI carrying a change-order proposal (description, items, amount) lands in the Approvals inbox alongside invoices and other pending decisions."}]},{"id":"flow-compliance","name":"Request a COI by email","category":"Compliance","summary":"Ask once, the sub uploads through a link, the AI fills in the details.","steps":[{"n":1,"node":"ui-proj-compliance","edge":"e-comp-api","title":"Request the document","detail":"Pick the sub and the document type: COI, licence, W-9, workers' comp or other."},{"n":2,"node":"api-compliance","edge":"e-service-compliance","title":"Mint the upload link","detail":"A compliance_requests row with a secret token; the sub gets the URL."},{"n":3,"node":"actor-guest","edge":"e-guest-mw","title":"Sub opens it","detail":"First open flips the request from 'pending' to 'viewed'. Partial uploads are allowed - they can come back for the rest."},{"n":4,"node":"api-public","edge":"e-public-ai","title":"Scan the upload","detail":"The document is sent to Claude and lib/compliance-extract.ts normalises carrier, policy number, coverage and expiry into typed fields plus a human summary."},{"n":5,"node":"db-compliance","edge":"e-service-compliance","title":"File it","detail":"compliance_documents stores status (active / expiring_soon / expired) and expiry_date, per sub per project or company-wide."}]},{"id":"flow-compliance-cron","name":"Nightly compliance expiry sweep","category":"Compliance","summary":"The only scheduled job in the system.","steps":[{"n":1,"node":"vercel-cron","edge":"e-cron-api","title":"Fire at 08:07 UTC","detail":"Declared in vercel.json. Authenticated by the x-vercel-cron header, or CRON_SECRET when called by hand."},{"n":2,"node":"api-cron","edge":"e-cron-compliance","title":"Find what is expiring","detail":"compliance_documents with an expiry_date inside the next 30 days and reminder_sent_at still null."},{"n":3,"node":"db-compliance","edge":"e-cron-notify","title":"Notify the owning company","detail":"Every profile at that company gets a compliance_expiring notification naming the document, the company and the days remaining."},{"n":4,"node":"lib-notify","edge":"e-notify-db","title":"Stamp it once","detail":"reminder_sent_at is set and status becomes expiring_soon, so a document fires exactly once per expiry cycle."}]},{"id":"flow-materials","name":"Snap a receipt into the budget","category":"Money","summary":"Photo to structured purchase to budget line, in one pass.","steps":[{"n":1,"node":"ui-workspace","edge":"e-workspace-ai","title":"Photograph the receipt","detail":"From the Materials page or a phone."},{"n":2,"node":"api-ai","edge":"e-ai-claude","title":"Read it","detail":"Claude returns store, date, amounts, tax, category and line items from the image or PDF."},{"n":3,"node":"ext-claude","edge":"e-workspace-money","title":"Assign it","detail":"Pick the job, then link an existing budget line or create a new one on the spot - the same interaction as awarding a quote."},{"n":4,"node":"api-money","edge":"e-service-money","title":"Save the purchase","detail":"material_purchases stores the receipt image, the line items and a client_paid flag."},{"n":5,"node":"db-money","title":"Split the totals","detail":"'Customer already paid' divides amounts into customer-paid vs owed-by-customer on Materials, Financials and Budget. Stores can be saved to the Directory as suppliers."}]},{"id":"flow-portal","name":"Share the client portal","category":"Access","summary":"A read-only window on the job for the person paying for it.","steps":[{"n":1,"node":"ui-projects","edge":"e-projects-api","title":"Generate the link","detail":"POST /api/projects/[id]/portal-token."},{"n":2,"node":"api-projects-core","edge":"e-api-service","title":"Mint the token","detail":"32 random bytes from crypto.getRandomValues, hex-encoded, written to projects.client_portal_token. Regenerating replaces the old link."},{"n":3,"node":"db-projects","edge":"e-guest-mw","title":"Client opens it","detail":"/portal/[token] renders outside every authenticated layout."},{"n":4,"node":"shell-public","edge":"e-public-projects","title":"They see progress and payments","detail":"Job progress and payment stages, with no account and no access to anything else. Unlike the bid, RFI and compliance token pages - which are client components calling their own API routes - the portal is a server component querying Supabase directly with the service-role client, so there is no /api/portal route."}]},{"id":"flow-calendar","name":"Subscribe to the calendar feed","category":"Access","summary":"SyteNav dates inside Google, Apple or Outlook.","steps":[{"n":1,"node":"ui-settings","edge":"e-settings-cal","title":"Connect calendar","detail":"Settings mints profiles.calendar_token and shows the subscription URL."},{"n":2,"node":"calendar-client","edge":"e-cal-api","title":"Calendar app polls","detail":"Calendar clients cannot send auth headers, so the secret token in the URL is the only credential. The feed is read-only by design."},{"n":3,"node":"api-calendar","edge":"e-calendar-db","title":"Build the iCal","detail":"Resolves the profile by calendar_token, collects the company's project dates, and emits VEVENTs with values escaped per RFC 5545."}]},{"id":"flow-qbo","name":"Connect QuickBooks","category":"Integrations","summary":"OAuth2 to Intuit, then a one-way push of accounting data.","steps":[{"n":1,"node":"ui-settings","edge":"e-settings-qbo","title":"Click connect","detail":"The card only offers this when qboConfigured() sees both client id and secret."},{"n":2,"node":"api-integrations","edge":"e-integrations-qbolib","title":"Redirect to Intuit","detail":"authorizeUrl() with scope com.intuit.quickbooks.accounting and a state row in quickbooks_oauth_states."},{"n":3,"node":"lib-quickbooks","edge":"e-qbo-ext","title":"Exchange the code","detail":"The callback swaps the code for access and refresh tokens over HTTP Basic, and stores them in quickbooks_connections."},{"n":4,"node":"ext-qbo","edge":"e-service-ops","title":"Sync","detail":"Phase 1 pushes from SyteNav to QBO against API minor version 73, sandbox or production by QBO_ENV, writing quickbooks_sync_log."}]},{"id":"flow-search","name":"Global search","category":"Workspace","summary":"One box across projects, customers, companies and files.","steps":[{"n":1,"node":"shell-dashboard","edge":"e-search-api","title":"Type a query","detail":"The global search component fires at two characters or more."},{"n":2,"node":"api-search","edge":"e-search-db","title":"Escape and fan out","detail":"Reserved PostgREST or() characters are stripped so a query containing a comma or percent sign cannot break the filter string."},{"n":3,"node":"db-projects","title":"Return grouped hits","detail":"Each hit carries a title, subtitle and href, grouped by entity type for the dropdown."}]},{"id":"flow-impersonate","name":"Super-admin impersonation","category":"Access","summary":"Real log-in-as for customer support, gated twice and logged.","steps":[{"n":1,"node":"actor-superadmin","edge":"e-super-mw","title":"Open /admin","detail":"The email must be in SUPER_ADMIN_EMAILS."},{"n":2,"node":"shell-admin","edge":"e-admin-gate","title":"Pass the PIN gate","detail":"ADMIN_PIN is verified server-side, then an HMAC of the user id (keyed by the service-role secret) is set as a cookie and compared with timingSafeEqual - so the gate cannot be forged or replayed by another account."},{"n":3,"node":"api-admin","edge":"e-admin-super","title":"Pick the target","detail":"POST /api/admin/impersonate re-checks isSuperAdmin on every call."},{"n":4,"node":"lib-super-admin","edge":"e-admin-auth","title":"Mint a real session","detail":"auth.admin.generateLink produces a one-time magic-link token_hash the browser verifies, giving a genuine session as the target user rather than a simulated view."},{"n":5,"node":"sb-auth","edge":"e-service-identity","title":"Log and banner it","detail":"impersonation_log records the event and a persistent banner shows who is being impersonated. Distinct from View As, which only previews another role's permissions."}]},{"id":"flow-invite","name":"Invite a teammate","category":"Access","summary":"Email invite to accepted member with a role and a permission grid.","steps":[{"n":1,"node":"ui-settings","edge":"e-settings-api","title":"Send the invite","detail":"Email plus a role, including any custom class the company has defined."},{"n":2,"node":"api-settings","edge":"e-settings-db","title":"Store it","detail":"company_invites holds the pending invite."},{"n":3,"node":"db-identity","edge":"e-authshell-auth","title":"They accept","detail":"/api/invite/accept and /api/complete-signup create the auth user and the profile, stamped with company_id and role."},{"n":4,"node":"hook-permissions","edge":"e-perms-api","title":"Grid applies immediately","detail":"Their first /api/me/permissions call resolves the role's defaults, any company override, and per-user overrides."},{"n":5,"node":"ui-proj-people","title":"Assigned-only roles need a project","detail":"Field supervisors, workers and read-only users see nothing until they are added on a project's Team tab."}]},{"id":"flow-inspection","name":"Ready for inspection to result","category":"Compliance","summary":"The sub raises a hand, the GC books it, the result gates the next stage.","steps":[{"n":1,"node":"ui-sub","edge":"e-sub-api","title":"Sub marks work ready","detail":"From My Jobs, on their own scope."},{"n":2,"node":"api-compliance","edge":"e-comp-notify","title":"Notify the GC","detail":"Marking ready writes only ready_marked_by / ready_marked_at and leaves status alone, so it sits outside the status-change notifications; it gets its own branch that logs an inspection_ready activity entry and notifies whoever requested the inspection plus whoever schedules it, falling back to the GC company's profiles when the request came from the sub side. Before that branch existed the hand went up and nothing reached the GC. Email and SMS are still on the backlog."},{"n":3,"node":"lib-notify","edge":"e-service-compliance","title":"Schedule it","detail":"The inspection is requested and scheduled; it shows on the Master Calendar."},{"n":4,"node":"db-compliance","edge":"e-comp-ai","title":"Record the result","detail":"Pass or fail, with an AI-read inspection card where a document is supplied."},{"n":5,"node":"ui-proj-money","title":"Gate the money","detail":"A pass can release the next payment stage on the sub's schedule."}]},{"id":"flow-field-mode","name":"Field Mode routing","category":"Field","summary":"Why a worker never sees the office app.","steps":[{"n":1,"node":"actor-field","edge":"e-field-mw","title":"Worker signs in","detail":"Same login as everyone else."},{"n":2,"node":"shell-dashboard","edge":"e-dash-field-redirect","title":"Bounced out of the office app","detail":"The dashboard layout reads profiles.role and redirects FIELD_ROLES to /field before rendering any chrome."},{"n":3,"node":"shell-field","edge":"e-shell-field-pages","title":"Field shell takes over","detail":"No sidebar, no project tabs, no company money. Bottom nav, idle logout, and a preview banner when an admin is looking."},{"n":4,"node":"ui-field-pages","edge":"e-fieldpages-api","title":"Four screens","detail":"Today, Tasks, Log, Me. Office roles that navigate to /field are sent back to /dashboard, except admins and managers previewing it."}]},{"id":"flow-activity","name":"Activity and notification fan-out","category":"Workspace","summary":"The two write paths every feature shares.","steps":[{"n":1,"node":"api-money","edge":"e-money-activity","title":"Any handler with a side effect","detail":"Roughly 40 route handlers call logActivity after they mutate something."},{"n":2,"node":"lib-activity","edge":"e-activity-db","title":"One writer","detail":"project_activity rows carry project_id, actor name and id, type, message and a metadata jsonb."},{"n":3,"node":"db-projects","edge":"e-dashboard-api","title":"Read back two ways","detail":"The dashboard Recent Activity feed and the per-project activity drawer. Non-admins see their own actions; admins see everything."},{"n":4,"node":"lib-notify","edge":"e-notify-db","title":"Notifications are separate","detail":"createNotification writes a per-user row that drives the bell: task_assigned, bid_awarded, invoice_approved, compliance_expiring and more."}]}]}</script>
<script>
(() => {
'use strict';
const G = JSON.parse(document.getElementById('graph-data').textContent);

/* ── Layout ─────────────────────────────────────────────────────────────
   Columns by layer (meta.layout.layers), stacked top-to-bottom by node.order,
   each column vertically centred. Same rule any other renderer can follow.  */
const NW = 206, NH = 64, VGAP = 11, COLW = 268, PADX = 36, TOPY = 62;

const LAYERS = G.meta.layout.layers;
const layerIndex = new Map(LAYERS.map((l,i) => [l.id, i]));
const N = new Map(G.nodes.map(n => [n.id, n]));
const E = new Map(G.edges.map(e => [e.id, e]));

const byLayer = new Map(LAYERS.map(l => [l.id, []]));
for (const n of G.nodes) byLayer.get(n.layer).push(n);
for (const [, arr] of byLayer) arr.sort((a,b) => a.order - b.order);

const maxCount = Math.max(...[...byLayer.values()].map(a => a.length));
const colH = maxCount * (NH + VGAP) - VGAP;
for (const [lid, arr] of byLayer) {
  const h = arr.length * (NH + VGAP) - VGAP;
  const y0 = TOPY + (colH - h) / 2;
  arr.forEach((n, i) => {
    n._x = PADX + layerIndex.get(lid) * COLW;
    n._y = y0 + i * (NH + VGAP);
  });
}
const W = PADX * 2 + (LAYERS.length - 1) * COLW + NW;
const H = TOPY + colH + 50;

/* Which edges each node touches, and which flows each node appears in. */
const nodeEdges = new Map(G.nodes.map(n => [n.id, []]));
for (const e of G.edges) { nodeEdges.get(e.from).push(e); nodeEdges.get(e.to).push(e); }
const nodeFlows = new Map(G.nodes.map(n => [n.id, []]));
for (const f of G.flows) for (const id of new Set(f.steps.map(s => s.node))) nodeFlows.get(id).push(f);

/* ── SVG build ──────────────────────────────────────────────────────── */
const SVG = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const layersG = document.getElementById('layersG');
const edgesG = document.getElementById('edgesG');
const nodesG = document.getElementById('nodesG');
const badgesG = document.getElementById('badgesG');
const el = (t, a = {}) => { const x = document.createElementNS(SVG, t); for (const k in a) x.setAttribute(k, a[k]); return x; };

/* Column headings */
LAYERS.forEach((l, i) => {
  const g = el('g', { class: 'layerlab', 'data-layer': l.id });
  const t = el('text', { x: PADX + i * COLW, y: 30 });
  t.textContent = l.label;
  g.appendChild(t);
  g.appendChild(el('line', { class: 'layerrule', x1: PADX + i * COLW, y1: 42, x2: PADX + i * COLW + NW, y2: 42 }));
  layersG.appendChild(g);
});

/* Edge geometry: exit right, enter left. Backward or same-column hops bow
   around the columns instead of cutting straight through them. */
function edgePath(a, b) {
  const x1 = a._x + NW, y1 = a._y + NH / 2;
  const x2 = b._x, y2 = b._y + NH / 2;
  if (x2 >= x1 - 4) {
    const dx = Math.max(46, (x2 - x1) * 0.46);
    return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
  }
  const bx1 = a._x + NW + 34, bx2 = b._x - 34;
  const dip = (y1 + y2) / 2 + (y2 > y1 ? 90 : -90);
  return `M${x1},${y1} C${bx1},${y1} ${bx1},${dip} ${(x1 + x2) / 2},${dip} C${bx2},${dip} ${bx2},${y2} ${x2},${y2}`;
}

const edgeEls = new Map();
for (const e of G.edges) {
  const a = N.get(e.from), b = N.get(e.to);
  const g = el('g', { class: 'edge-g', 'data-id': e.id });
  const p = el('path', { class: `edge kind-${e.kind}`, d: edgePath(a, b) });
  g.appendChild(p);
  const mx = (a._x + NW + b._x) / 2, my = (a._y + b._y) / 2 + NH / 2;
  const lab = el('text', { class: 'elabel', x: mx, y: my - 6, 'text-anchor': 'middle' });
  lab.textContent = e.label;
  g.appendChild(lab);
  edgesG.appendChild(g);
  edgeEls.set(e.id, { g, p });
}

const nodeEls = new Map();
for (const n of G.nodes) {
  const g = el('g', { class: 'node', 'data-id': n.id, transform: `translate(${n._x},${n._y})` });
  g.style.setProperty('--lc', `var(--L-${n.layer})`);
  const fo = el('foreignObject', { width: NW, height: NH });
  const box = document.createElement('div');
  box.className = 'box';
  box.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
  const t = document.createElement('div'); t.className = 't'; t.textContent = n.label;
  const k = document.createElement('div'); k.className = 'k'; k.textContent = n.kind;
  box.append(t, k);
  fo.appendChild(box);
  g.appendChild(fo);
  nodesG.appendChild(g);
  nodeEls.set(n.id, g);
}

/* ── Pan / zoom ─────────────────────────────────────────────────────── */
let tx = 0, ty = 0, k = 1;
const apply = () => viewport.setAttribute('transform', `translate(${tx},${ty}) scale(${k})`);
/* On phones the flows drawer covers the lower part of the stage, and fitting
   74 nodes into 390px would shrink the labels past legibility - so frame into
   the visible slice and keep a readable floor, letting the user pan instead. */
const SMALL = () => innerWidth <= 1000;
function frame() {
  const r = svg.getBoundingClientRect();
  return { w: r.width, h: SMALL() ? Math.max(240, r.height * 0.40) : r.height };
}
function place(w, h, cx, cy, scale, pad) {
  const f = frame();
  k = scale;
  tx = w * k <= f.w - pad ? f.w / 2 - cx * k : pad / 2;
  ty = h * k <= f.h - pad ? f.h / 2 - cy * k : pad / 2;
}
function fit(pad = 40) {
  const f = frame();
  const s = Math.min((f.w - pad * 2) / W, (f.h - pad) / H, 1.35);
  place(W, H, W / 2, H / 2, Math.max(s, SMALL() ? 0.34 : 0.14), pad);
  apply();
}
let anim = null;
function smooth() { apply(); }
function animateTo(nx, ny, nk) {
  const t0 = { tx, ty, k }, start = performance.now(), dur = 340;
  cancelAnimationFrame(anim);
  (function frame(now) {
    const p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
    tx = t0.tx + (nx - t0.tx) * e; ty = t0.ty + (ny - t0.ty) * e; k = t0.k + (nk - t0.k) * e;
    apply();
    if (p < 1) anim = requestAnimationFrame(frame);
  })(start);
}
function centerOn(n, scale) {
  const f = frame();
  const target = scale ?? Math.max(k, SMALL() ? 0.7 : 0.82);
  animateTo(f.w / 2 - (n._x + NW / 2) * target, f.h / 2 - (n._y + NH / 2) * target, target);
}
/* Frame just the nodes a flow touches, so selecting one fills the canvas with
   that path instead of the whole 74-node map. */
function fitNodes(ids, pad = 92) {
  const ns = [...new Set(ids)].map(id => N.get(id)).filter(Boolean);
  if (!ns.length) return fit();
  const x0 = Math.min(...ns.map(n => n._x)), x1 = Math.max(...ns.map(n => n._x + NW));
  const y0 = Math.min(...ns.map(n => n._y)), y1 = Math.max(...ns.map(n => n._y + NH));
  const f = frame();
  if (SMALL()) pad = 24;
  const target = Math.min((f.w - pad * 2) / (x1 - x0), (f.h - pad * 2) / (y1 - y0), 1.15);
  animateTo(f.w / 2 - (x0 + x1) / 2 * target, f.h / 2 - (y0 + y1) / 2 * target, target);
}
const fitFlow = () => activeFlow && fitNodes(activeFlow.steps.map(s => s.node));

svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAbout(ev.clientX - r.left, ev.clientY - r.top, k * Math.exp(-ev.deltaY * 0.0016), { tx, ty, k });
}, { passive: false });

/* Pointer capture retargets the follow-up `click` to the <svg>, so selection is
   driven from pointerdown/up instead: remember what was under the pointer when
   it went down, and treat a release that barely moved as a click on it. */
let drag = null, moved = 0, downNode = null, pinch = null;
const pts = new Map();

function zoomAbout(mx, my, nk, from) {
  nk = Math.min(2.6, Math.max(0.14, nk));
  tx = mx - (mx - from.tx) * (nk / from.k);
  ty = my - (my - from.ty) * (nk / from.k);
  k = nk; apply();
}

svg.addEventListener('pointerdown', ev => {
  if (ev.button !== 0) return;
  pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pts.size === 2) {                                   // second finger: pinch, not pan
    drag = null; downNode = null; moved = 999;
    const [a, b] = [...pts.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, k, tx, ty, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
    return;
  }
  downNode = ev.target.closest?.('.node')?.dataset.id ?? null;
  drag = { x: ev.clientX, y: ev.clientY, tx, ty }; moved = 0;
  try { svg.setPointerCapture(ev.pointerId) } catch { /* pointer already gone */ }
  svg.classList.add('dragging');
});
svg.addEventListener('pointermove', ev => {
  if (pts.has(ev.pointerId)) pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pinch && pts.size >= 2) {
    const [a, b] = [...pts.values()];
    const r = svg.getBoundingClientRect();
    zoomAbout(pinch.cx - r.left, pinch.cy - r.top, pinch.k * (Math.hypot(a.x - b.x, a.y - b.y) / pinch.d), pinch);
    return;
  }
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
  tx = drag.tx + dx; ty = drag.ty + dy; apply();
});
function endDrag(ev) {
  drag = null; svg.classList.remove('dragging');
  if (ev && ev.pointerId != null) {
    pts.delete(ev.pointerId);
    if (svg.hasPointerCapture(ev.pointerId)) svg.releasePointerCapture(ev.pointerId);
  }
  if (pts.size < 2) pinch = null;
}
svg.addEventListener('pointerup', ev => {
  const hit = downNode, dist = moved;
  endDrag(ev); downNode = null;
  if (dist > 5) return;
  if (hit) selectNode(hit, false);
  else if (selectedNode || activeFlow) {
    selectedNode = null; activeFlow = null; activeStep = -1;
    clearClasses(); renderFlowList(); showTab('flows');
  }
});
svg.addEventListener('pointercancel', ev => { endDrag(ev); downNode = null; });

document.getElementById('zoomIn').onclick = () => { k = Math.min(2.6, k * 1.25); apply(); };
document.getElementById('zoomOut').onclick = () => { k = Math.max(0.14, k / 1.25); apply(); };
document.getElementById('fit').onclick = () => fit();

/* ── Tooltip ────────────────────────────────────────────────────────── */
const tip = document.getElementById('tip');
function showTip(n, ev) {
  tip.innerHTML = '';
  const a = document.createElement('div'); a.className = 'tt'; a.textContent = n.label;
  const b = document.createElement('div'); b.className = 'tk';
  b.textContent = `${n.kind} · ${LAYERS[layerIndex.get(n.layer)].label}`;
  const c = document.createElement('div'); c.className = 'ts'; c.textContent = n.summary;
  tip.append(a, b, c);
  if (n.paths && n.paths.length) {
    const d = document.createElement('div'); d.className = 'tp mono';
    d.textContent = n.paths.slice(0, 2).join('  ·  ') + (n.paths.length > 2 ? `  +${n.paths.length - 2} more` : '');
    tip.appendChild(d);
  }
  tip.classList.add('on'); moveTip(ev);
}
function moveTip(ev) {
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 16, y = ev.clientY + 16;
  if (x + r.width > innerWidth - 10) x = ev.clientX - r.width - 16;
  if (y + r.height > innerHeight - 10) y = ev.clientY - r.height - 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => tip.classList.remove('on');

/* ── Selection state ────────────────────────────────────────────────── */
let activeFlow = null, activeStep = -1, selectedNode = null;

function clearClasses() {
  for (const g of nodeEls.values()) g.classList.remove('hl', 'dim', 'active', 'match', 'sel');
  for (const { g, p } of edgeEls.values()) { g.classList.remove('hl'); p.classList.remove('hl', 'related'); }
  badgesG.innerHTML = '';
  svg.classList.remove('dimmed');
}

function paintFlow() {
  clearClasses();
  if (!activeFlow) { if (selectedNode) paintNodeSelection(); return; }
  svg.classList.add('dimmed');
  const order = new Map();
  activeFlow.steps.forEach(s => { if (!order.has(s.node)) order.set(s.node, s.n); });
  for (const [id, num] of order) {
    nodeEls.get(id)?.classList.add('hl');
    const n = N.get(id);
    const g = el('g', { class: 'badge' });
    g.appendChild(el('circle', { cx: n._x + 3, cy: n._y + 3, r: 11 }));
    const t = el('text', { x: n._x + 3, y: n._y + 3 }); t.textContent = num;
    g.appendChild(t);
    badgesG.appendChild(g);
  }
  for (const s of activeFlow.steps) if (s.edge) {
    const ee = edgeEls.get(s.edge);
    if (ee) { ee.g.classList.add('hl'); ee.p.classList.add('hl'); }
  }
  if (activeStep >= 0) {
    const s = activeFlow.steps[activeStep];
    nodeEls.get(s.node)?.classList.add('active');
  }
}

function paintNodeSelection() {
  clearClasses();
  if (!selectedNode) return;
  svg.classList.add('dimmed');
  nodeEls.get(selectedNode)?.classList.add('hl', 'sel');
  for (const e of nodeEdges.get(selectedNode)) {
    const ee = edgeEls.get(e.id);
    ee.g.classList.add('hl'); ee.p.classList.add('related');
    nodeEls.get(e.from)?.classList.add('hl');
    nodeEls.get(e.to)?.classList.add('hl');
  }
}

/* ── Panel ──────────────────────────────────────────────────────────── */
const paneFlows = document.getElementById('pane-flows');
const paneDetail = document.getElementById('pane-detail');
const paneLegend = document.getElementById('pane-legend');
const tabs = [...document.querySelectorAll('.tab')];
function showTab(id) {
  tabs.forEach(t => t.setAttribute('aria-selected', String(t.id === 'tab-' + id)));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'pane-' + id));
  if (innerWidth <= 1000) openPanel(true);
}
tabs.forEach(t => t.onclick = () => showTab(t.id.replace('tab-', '')));

const h = (tag, cls, txt) => { const x = document.createElement(tag); if (cls) x.className = cls; if (txt != null) x.textContent = txt; return x; };

function renderFlowList(filter = '') {
  paneFlows.innerHTML = '';
  const input = h('input', 'flowsearch');
  input.type = 'search'; input.placeholder = 'Filter flows…'; input.value = filter;
  input.oninput = () => renderFlowList(input.value);
  paneFlows.appendChild(input);

  const q = filter.trim().toLowerCase();
  const list = G.flows.filter(f => !q ||
    (f.name + ' ' + f.summary + ' ' + f.category + ' ' + f.steps.map(s => s.title + ' ' + s.detail).join(' '))
      .toLowerCase().includes(q));

  if (!list.length) { paneFlows.appendChild(h('div', 'empty', 'No flow matches that.')); return; }

  let cat = null;
  for (const f of list) {
    if (f.category !== cat) { cat = f.category; paneFlows.appendChild(h('div', 'cat', cat)); }
    const b = h('button', 'flow');
    b.setAttribute('aria-current', String(activeFlow?.id === f.id));
    const nm = h('div', 'fn'); nm.append(document.createTextNode(f.name), h('span', 'cnt', f.steps.length + ' steps'));
    b.append(nm, h('div', 'fs', f.summary));
    b.onclick = () => selectFlow(f.id);
    paneFlows.appendChild(b);
  }
  if (activeFlow) { requestAnimationFrame(() => renderFlowDetail()); }
}

function renderFlowDetail() {
  const f = activeFlow;
  paneFlows.innerHTML = '';
  const head = h('div', 'flowhead');
  head.appendChild(h('h2', null, f.name));
  const back = h('button', 'btn icon', '✕'); back.title = 'Close flow';
  back.onclick = () => { activeFlow = null; activeStep = -1; paintFlow(); renderFlowList(); };
  head.appendChild(back);
  paneFlows.append(head, h('p', 'lede', f.summary));

  const nav = h('div', 'stepnav');
  const prev = h('button', 'btn', '← Prev'); prev.onclick = () => step(activeStep - 1);
  const next = h('button', 'btn', 'Next →'); next.onclick = () => step(activeStep + 1);
  const all = h('button', 'btn', 'Whole path'); all.onclick = () => { activeStep = -1; paintFlow(); fitFlow(); renderFlowDetail(); };
  nav.append(prev, next, all);
  paneFlows.appendChild(nav);

  const ol = h('ol', 'steps');
  f.steps.forEach((s, i) => {
    const n = N.get(s.node);
    const li = h('li', 'step');
    li.setAttribute('aria-current', String(i === activeStep));
    li.appendChild(h('div', 'num', String(s.n)));
    li.appendChild(h('div', 'st', s.title));
    li.appendChild(h('div', 'sn', n.label + (s.edge ? '  →  ' + E.get(s.edge).label : '')));
    if (s.detail) li.appendChild(h('div', 'sd', s.detail));
    li.onclick = () => step(i);
    ol.appendChild(li);
  });
  paneFlows.appendChild(ol);
}

function step(i) {
  if (!activeFlow) return;
  activeStep = Math.max(0, Math.min(activeFlow.steps.length - 1, i));
  paintFlow();
  centerOn(N.get(activeFlow.steps[activeStep].node));
  renderFlowDetail();
  const cur = paneFlows.querySelector('.step[aria-current="true"]');
  cur?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function selectFlow(id) {
  activeFlow = G.flows.find(f => f.id === id);
  activeStep = -1; selectedNode = null;
  paintFlow(); renderFlowDetail(); showTab('flows'); fitFlow();
}

function renderDetail(id) {
  const n = N.get(id);
  paneDetail.innerHTML = '';
  const root = h('div', 'det');
  root.style.setProperty('--lc', `var(--L-${n.layer})`);
  root.appendChild(h('h2', null, n.label));
  const chips = h('div');
  chips.append(h('span', 'chip lc', LAYERS[layerIndex.get(n.layer)].label), h('span', 'chip', n.kind));
  root.appendChild(chips);

  const add = (title, node) => { const s = h('div', 'sect'); s.appendChild(h('h3', null, title)); s.appendChild(node); root.appendChild(s); };
  add('What it is', h('p', null, n.summary));
  if (n.detail) add('How it works', h('p', null, n.detail));

  if (n.paths?.length) {
    const ul = h('ul', 'paths mono');
    n.paths.forEach(p => ul.appendChild(h('li', null, p)));
    add('Source', ul);
  }
  if (n.tables?.length) {
    const d = h('div', 'tags');
    n.tables.forEach(t => d.appendChild(h('span', 'tag mono', t)));
    add(`Tables (${n.tables.length})`, d);
  }
  if (n.tags?.length) {
    const d = h('div', 'tags');
    n.tags.forEach(t => d.appendChild(h('span', 'tag', t)));
    add('Tags', d);
  }

  const outs = nodeEdges.get(id).filter(e => e.from === id);
  const ins = nodeEdges.get(id).filter(e => e.to === id);
  const mkLinks = (arr, dir) => {
    const d = h('div', 'linkrow');
    arr.forEach(e => {
      const other = dir === 'out' ? e.to : e.from;
      const b = h('button', 'linkbtn', `${dir === 'out' ? '→' : '←'} ${N.get(other).label} · ${e.label}`);
      b.onclick = () => selectNode(other, true);
      d.appendChild(b);
    });
    return d;
  };
  if (outs.length) add(`Calls (${outs.length})`, mkLinks(outs, 'out'));
  if (ins.length) add(`Called by (${ins.length})`, mkLinks(ins, 'in'));

  const fl = nodeFlows.get(id);
  if (fl.length) {
    const d = h('div', 'linkrow');
    fl.forEach(f => { const b = h('button', 'linkbtn', '▸ ' + f.name); b.onclick = () => selectFlow(f.id); d.appendChild(b); });
    add(`Appears in ${fl.length} flow${fl.length > 1 ? 's' : ''}`, d);
  }
  paneDetail.appendChild(root);
}

function selectNode(id, recenter) {
  selectedNode = id; activeFlow = null; activeStep = -1;
  paintNodeSelection();
  renderDetail(id);
  showTab('detail');
  renderFlowList();
  if (recenter) centerOn(N.get(id));
}

/* Node interaction */
nodesG.addEventListener('pointerover', ev => {
  const g = ev.target.closest?.('.node'); if (!g) return;
  showTip(N.get(g.dataset.id), ev);
});
nodesG.addEventListener('pointermove', ev => { if (tip.classList.contains('on')) moveTip(ev); });
nodesG.addEventListener('pointerout', ev => { if (!ev.relatedTarget?.closest?.('.node')) hideTip(); });
nodesG.addEventListener('pointerdown', hideTip);

/* ── Legend + layer filter ──────────────────────────────────────────── */
function renderLegend() {
  paneLegend.innerHTML = '';
  const add = (title, node) => { const s = h('div', 'sect'); s.appendChild(h('h3', null, title)); s.appendChild(node); paneLegend.appendChild(s); };

  const stats = h('dl', 'kv');
  const st = G.meta.stats;
  [['API routes', st.api_routes], ['Pages', st.pages], ['Components', st.components],
   ['DB tables', st.db_tables], ['SQL migrations', st.sql_migrations], ['TS/TSX lines', st.ts_tsx_loc.toLocaleString()],
   ['Nodes mapped', G.nodes.length], ['Edges mapped', G.edges.length], ['Flows mapped', G.flows.length]]
    .forEach(([a, b]) => { stats.appendChild(h('dt', null, a)); stats.appendChild(h('dd', null, String(b))); });
  add('At a glance', stats);

  const lay = h('div');
  LAYERS.forEach(l => {
    const lab = h('label', 'layertoggle');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true;
    cb.onchange = () => {
      byLayer.get(l.id).forEach(n => nodeEls.get(n.id).classList.toggle('hidden', !cb.checked));
      document.querySelector(`.layerlab[data-layer="${l.id}"]`).classList.toggle('hidden', !cb.checked);
      for (const e of G.edges) {
        const hide = N.get(e.from).layer === l.id || N.get(e.to).layer === l.id;
        if (hide) edgeEls.get(e.id).g.classList.toggle('hidden', !cb.checked);
      }
    };
    const sw = h('span', 'swatch'); sw.style.background = `var(--L-${l.id})`;
    lab.append(cb, sw, document.createTextNode(`${l.label} (${byLayer.get(l.id).length})`));
    lay.appendChild(lab);
  });
  add('Layers', lay);

  const kinds = h('div');
  Object.entries(G.meta.legend.edge_kinds).forEach(([kk, vv]) => {
    const row = h('div', 'legend-item');
    const ln = h('span', 'legend-line');
    ln.style.borderTop = `2px ${kk === 'external' ? 'dashed' : kk === 'event' ? 'dotted' : kk === 'redirect' ? 'dashed' : 'solid'} var(--muted-fg)`;
    row.append(ln, h('span', null, `${kk} — ${vv}`));
    kinds.appendChild(row);
  });
  add('Edge kinds', kinds);

  const conv = h('div');
  Object.entries(G.meta.conventions).forEach(([kk, vv]) => {
    const s = h('div'); s.style.marginBottom = '9px';
    s.appendChild(h('div', null, kk.replace(/_/g, ' '))).style.cssText = 'font-weight:650;font-size:12.5px;text-transform:capitalize';
    s.appendChild(h('div', null, vv)).style.cssText = 'font-size:12.5px;color:var(--muted-fg);line-height:1.5';
    conv.appendChild(s);
  });
  add('Conventions', conv);

  const note = h('div', 'note', 'Generated from commit ' + G.meta.commit + ' on ' + G.meta.generated +
    '. Regenerate with: node docs/architecture/build.mjs');
  paneLegend.appendChild(note);
}

/* ── Component search ───────────────────────────────────────────────── */
const q = document.getElementById('q');
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase();
  clearClasses();
  if (!s) { if (activeFlow) paintFlow(); else if (selectedNode) paintNodeSelection(); return; }
  svg.classList.add('dimmed');
  let hits = 0, first = null;
  for (const n of G.nodes) {
    const hay = [n.label, n.kind, n.summary, n.detail, ...(n.paths || []), ...(n.tables || [])].join(' ').toLowerCase();
    if (hay.includes(s)) { nodeEls.get(n.id).classList.add('match'); hits++; if (!first) first = n; }
  }
  if (hits === 1 && first) centerOn(first);
});
q.addEventListener('keydown', ev => { if (ev.key === 'Escape') { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); } });

/* ── Theme ──────────────────────────────────────────────────────────── */
const root = document.documentElement;
document.getElementById('theme').onclick = () => {
  const order = ['auto', 'light', 'dark'];
  root.dataset.theme = order[(order.indexOf(root.dataset.theme) + 1) % 3];
  document.getElementById('theme').title = 'Theme: ' + root.dataset.theme;
};

/* ── Keyboard ───────────────────────────────────────────────────────── */
addEventListener('keydown', ev => {
  if (ev.target.matches('input')) return;
  if (ev.key === 'f' || ev.key === 'F') fit();
  if (ev.key === 'Escape') { activeFlow = null; activeStep = -1; selectedNode = null; clearClasses(); renderFlowList(); showTab('flows'); }
  if (activeFlow && (ev.key === 'ArrowDown' || ev.key === 'j')) { ev.preventDefault(); step(activeStep + 1); }
  if (activeFlow && (ev.key === 'ArrowUp' || ev.key === 'k')) { ev.preventDefault(); step(activeStep - 1); }
});

/* ── Mobile drawer ──────────────────────────────────────────────────── */
const panel = document.getElementById('panel'), toggle = document.getElementById('panelToggle');
function openPanel(on) { panel.classList.toggle('open', on); toggle.textContent = on ? 'Hide ▼' : 'Flows ▲'; }
toggle.onclick = () => openPanel(!panel.classList.contains('open'));

/* ── Go ─────────────────────────────────────────────────────────────── */
document.getElementById('subtitle').textContent =
  `${G.meta.stats.api_routes} API routes · ${G.meta.stats.pages} pages · ${G.meta.stats.db_tables} tables · ${G.flows.length} flows`;
renderFlowList();
renderLegend();
fit();
addEventListener('resize', () => fit());
})();
</script>
</body>
</html>
