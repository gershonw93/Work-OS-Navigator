ext {
    minSdkVersion = 22
    // 35, not Capacitor 6's default of 34. Google Play refuses a NEW app, and
    // any update, that targets less than API 35 (the rule since Aug 31 2025).
    // Capacitor 6 plugins read these same values off rootProject.ext, so they
    // compile against 35 too. See gradle.properties for the AGP note.
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
}